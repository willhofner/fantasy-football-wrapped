<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#0B0B0B; --card:#1C1C1C; --card-2:#262626; --line:#2E2E2E; --fg:#FFFFFF; --muted:#A8A8A8; --faint:#6E6E6E;
  --green:#53D337; --green-ink:#0A1A05; --green-tint:#172814; --green-tint-2:#1F3A19; --green-line:#2F5A26;
  --red:#FF5147; --open:#F5C02E; --open-tint:#3A300E;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:Barlow,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-weight:700;font-size:24px}
.whoami{display:flex;align-items:baseline;gap:6px;text-align:right}
.whoami small{font-size:13px;font-weight:500;color:var(--muted)}
.whoami b{font-size:24px;font-weight:700;text-transform:uppercase;color:var(--green);line-height:1.1}
.brand{flex-wrap:wrap}
.due{display:flex;align-items:baseline;gap:6px;margin-left:auto}
.due small{font-size:13px;font-weight:500;color:var(--muted)}
.due b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:.3px}
.due b{display:inline-flex}
.due b i{font-style:normal;display:inline-block;min-width:.6em;text-align:center}
.due b i.c{min-width:0;padding:0 1px}
.due.soon b{color:#FF6B61}
.due.last b{color:#FF3B30;text-shadow:0 0 10px rgba(255,59,48,.55)}
@media (prefers-reduced-motion:no-preference){
  .due b i.flip{animation:dflip .38s cubic-bezier(.2,.9,.3,1.2) both}
  .due.last b{animation:dpulse 1s ease-in-out infinite}
  .due.final b{animation:dbeat 1s ease-in-out infinite}
}
@keyframes dflip{from{transform:translateY(-55%) rotateX(70deg);opacity:0}}
@keyframes dpulse{50%{text-shadow:0 0 18px rgba(255,59,48,.95),0 0 2px rgba(255,59,48,.9)}}
@keyframes dbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}26%{transform:scale(1.02)}36%{transform:scale(1.08)}}
.mainwrap{display:flex;flex-direction:column;gap:18px}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.gate-in{max-width:420px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate-t{margin:0;font-family:var(--display);font-size:34px;font-weight:800;line-height:1.05;text-transform:uppercase}
.gate-b{margin:0;font-size:16px;color:var(--muted);line-height:1.4}
.gate-a{color:var(--green);font-weight:700;text-decoration:none;margin-top:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin:0}
.sec{display:flex;flex-direction:column;gap:8px}
.hint{margin:0;font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* who */
.who{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.who button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* slip */
.slip{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slip-h{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
.slip-h h2{margin:0;font-size:19px;font-weight:700}
.slip-h .sep{width:1px;height:16px;background:var(--faint)}
.slip-h .odds{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.slip-h .pay{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slip-h .pay b{display:block;font-size:17px;color:var(--green)}
.pips{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:0 16px 12px}
.pips i{height:5px;border-radius:3px;background:var(--card-2)}
.pips i.on{background:var(--green)}
.sl-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.sl-row.me{background:var(--green-tint)}
.sl-row .nm{font-weight:700;font-size:14px}
.sl-row .pk{display:flex;flex-direction:column;gap:1px;min-width:0}
.sl-row .pk b{font-size:15px;font-weight:700}
.sl-row .pk span{font-size:12px;color:var(--muted)}
.sl-row .none{font-size:13px;color:var(--faint)}
.sl-row .o{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.sl-row.me .o{color:var(--green)}
.x{border:none;background:var(--card-2);border-radius:999px;width:28px;height:28px;margin-left:6px;cursor:pointer;color:var(--muted)}
.o-wrap{display:flex;align-items:center}

/* filters */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.search{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.search::placeholder{color:var(--faint)}
.qwrap{position:relative}
.qwrap .search{padding-right:44px}
.search::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:var(--card-2,#262626);color:var(--fg);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qx[hidden]{display:none}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;min-height:34px;padding:0 13px;border-radius:999px;border:none;background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* games */
.game{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.g-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 8px;gap:10px}
.g-head b{font-size:16px}
.g-head span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.lines{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,74px);gap:6px;padding:0 16px 12px;align-items:center}
.lines .h{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--faint);text-align:center;text-transform:uppercase}
.lines .tm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{position:relative;min-height:46px;border-radius:8px;border:1px solid transparent;background:var(--card-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px 2px;font-variant-numeric:tabular-nums}
.btn small{font-size:12px;color:var(--muted);font-weight:600}
.btn b{font-size:14px;font-weight:700;color:var(--green)}
.btn:disabled{cursor:default;opacity:.45}
.slip-intro{margin:0;padding:12px 16px 0;font-size:13px;color:var(--muted);line-height:1.4}
.o-col{display:flex;flex-direction:column;align-items:flex-end}
.was{font-size:10px;color:var(--faint);font-weight:600;white-space:nowrap}
.jail-box{margin-top:26px;border:1px dashed rgba(245,192,46,.55);border-radius:12px;padding:10px 12px;background:repeating-linear-gradient(90deg,rgba(245,192,46,.05) 0 10px,transparent 10px 20px)}
.jail-h{display:flex;align-items:baseline;gap:8px}
.jail-h b{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--open)}
.jail-h span{font-size:12px;color:var(--muted)}
.jail-note{margin:4px 0 6px;font-size:12px;color:var(--muted);line-height:1.4}
.lockbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#3A1714;border-top:1px solid #FF5147;box-shadow:0 -8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
html.locked body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.editbar{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:rgba(245,192,46,.14);border:1px solid rgba(245,192,46,.5);color:#F5D67A;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.editbar a{color:#F5C02E;font-weight:700;text-decoration:none;white-space:nowrap}
.whoami b.editing{color:#F5C02E}
.lm-picks{display:flex;flex-direction:column}
.lm-secs{display:flex;flex-direction:column;gap:22px}
.lm-pick{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line, rgba(255,255,255,.08))}
.lm-pick div{min-width:0}
.lm-pick b{display:block;font-size:14px}
.lm-pick span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm-pick a{flex:none;text-decoration:none;display:inline-flex;align-items:center}
.lockstate{font-size:14px;font-weight:700}
.lockstate.on{color:#FF8A80} .lockstate.off{color:var(--green)}
.lock-btns{display:flex;gap:8px;flex-wrap:wrap}
.lockbar b{font-size:14px;color:#FF8A80;text-transform:uppercase;letter-spacing:.6px}
.lockbar span{font-size:12px;color:#E6E6E6}
.lockbar b{display:flex;align-items:center;gap:7px}
.padlock{width:16px;height:18px;flex:none}
.padlock .sh{fill:none;stroke:#FF8A80;stroke-width:2.4;stroke-linecap:round}
.padlock .bd{fill:#FF8A80}
.o-mv{display:inline-flex;align-items:center;gap:3px}
.o-mv .mv{font-style:normal;font-size:9px}
.o-mv .mv.up{color:var(--green)} .o-mv .mv.dn{color:var(--red)}
.o-roll{display:inline-grid;overflow:hidden;height:1.2em;line-height:1.2em}
.o-roll > span{grid-area:1/1}
.o-roll .o-old{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .fresh .lockbar:not([hidden]){animation:lockdrop .5s cubic-bezier(.3,1.4,.5,1) both}
  .fresh .padlock .sh{animation:snap .45s cubic-bezier(.5,0,.4,1.6) .35s both}
  .pips i.pop{animation:pippop .55s cubic-bezier(.3,1.7,.5,1) both}
  .fresh .o-roll .o-old{animation:oout .45s cubic-bezier(.6,0,.4,1) .9s both}
  .fresh .o-roll .o-new{animation:oin .45s cubic-bezier(.3,1.3,.5,1) .9s both}
  .fresh .o-mv .mv{animation:mvin .4s ease-out 1.25s both}
}
@keyframes lockdrop{from{transform:translateY(100%)}}
@keyframes snap{from{transform:translateY(-4px)}}
@keyframes pippop{0%{transform:scaleY(1);box-shadow:0 0 0 0 rgba(83,211,55,.7)}40%{transform:scaleY(2)}100%{transform:none;box-shadow:0 0 0 7px rgba(83,211,55,0)}}
@keyframes oout{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-100%)}}
@keyframes oin{from{opacity:0;transform:translateY(100%)}}
@keyframes mvin{from{opacity:0;transform:translateY(4px)}}
html.locked body::after{content:'';position:fixed;inset:0;border:4px solid var(--red,#FF5147);border-radius:0;pointer-events:none;z-index:60;box-shadow:inset 0 0 24px rgba(255,81,71,.35)}
.embed.locked body::after{display:none}
.view-tools #main > :not(#tools), .view-tools .brand, .view-tools #testas, .view-tools .back{display:none!important}
.view-tools.locked body::after{display:none}   /* the tracker draws the border around the whole screen */
.past-slips{margin-top:8px}
.past-slips summary{cursor:pointer;font-size:14px;font-weight:700;padding:6px 0}
.past-slips summary small{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:no-preference){
  .btn{transition:transform .12s ease}
  .btn:not(:disabled):active{transform:scale(.93)}
  .btn.bounce{animation:bounce .45s cubic-bezier(.3,1.7,.5,1) both}
  .sl-row.slidein .pk,.sl-row.slidein .o-wrap{animation:slidein .4s cubic-bezier(.2,.8,.2,1) both}
  .sl-row.slidein{animation:rowglow 1s ease-out both}
}
@keyframes bounce{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:translateY(-1px)}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}
@keyframes rowglow{from{background:rgba(83,211,55,.28)}}
.btn.mine,.btn.taken{transform:translateY(-1px)}
.btn.mine{background:linear-gradient(180deg,#8CEB72 0%,#53D337 55%,#3BAE24 100%);border-color:#B5F5A0 #3BAE24 #2A8A18;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 #23700F,0 4px 10px rgba(0,0,0,.45)}
.btn.mine small,.btn.mine b,.btn.mine .on-it{color:var(--green-ink)}
.btn.taken{cursor:not-allowed;background:linear-gradient(180deg,#FFE88F 0%,#F5C02E 55%,#D29E12 100%);border-color:#FFF3C2 #C9960F #A87C08;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 #7A5C06,0 4px 10px rgba(0,0,0,.45)}
.btn.taken small,.btn.taken b,.btn.taken .on-it{color:#2A1F00}
.btn .on-it{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;max-width:100%;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.visits{display:flex;flex-direction:column;gap:6px}
.vsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vsum div{background:var(--card-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.vsum b{font-size:14px}
.vsum span{font-size:12px;color:var(--muted)}
.vsum span.cold{color:var(--faint)}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.vlist li b{font-weight:700}
.vlist li em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.vlist li span{grid-column:1 / 3;font-size:12px;color:var(--faint)}
.vlist li.anon b{color:var(--muted)}
.more{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;border-top:1px solid var(--line);background:none;padding:12px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.props{border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column;gap:10px}
.ptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.ptabs button[aria-pressed="true"]{background:var(--card-2);color:var(--fg);border-color:var(--card-2)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px;gap:6px;align-items:center}
.prow.one{grid-template-columns:minmax(0,1fr) 84px}
.prow .pl{display:flex;flex-direction:column;gap:1px;min-width:0}
.prow .pl b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pl span{font-size:12px;color:var(--faint)}
.empty{margin:0;font-size:13px;color:var(--faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0}
.primary{min-height:44px;border-radius:10px;border:none;background:var(--green);color:var(--green-ink);font-weight:700;cursor:pointer;padding:0 16px}
.primary:disabled{opacity:.5;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.foot button{border:1px solid var(--line);background:none;border-radius:999px;min-height:32px;padding:0 12px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:-10px}
.writein{background:var(--card);border:1px solid var(--line);border-radius:14px}
.writein summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.writein summary::-webkit-details-marker{display:none}
.writein summary span:first-child{display:flex;flex-direction:column;gap:2px}
.writein summary b{font-size:15px}
.writein summary small{font-size:12px;color:var(--muted)}
.writein .plus{font-size:22px;color:var(--muted);line-height:1}
.writein[open] .plus{transform:rotate(45deg)}
.wform{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.wform label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.wform textarea,.wform input,.wform select{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:var(--fg);padding:10px 12px;font-size:16px;font-family:var(--body)}
.wform textarea{resize:vertical;min-height:64px}
.wrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.wrow div{display:flex;flex-direction:column;gap:6px;min-width:0}
.werr{margin:0;font-size:13px;color:var(--red);font-weight:600}
.slips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slips a{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:9/16;background:var(--card-2)}
.slips img{width:100%;height:100%;object-fit:cover;display:block}
.filebtn{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px dashed var(--green-line);color:var(--green);font-weight:700;cursor:pointer;background:var(--green-tint)}
.filebtn input{display:none}
.tool-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:none;border-radius:999px;min-height:36px;padding:0 14px;color:var(--fg);font-size:13px;font-weight:600;cursor:pointer}
.sandbox{margin:0;font-size:13px;color:var(--open);background:var(--open-tint);border-radius:10px;padding:10px 12px}
.sandbox a{color:var(--fg);font-weight:700}
.me-line{display:flex;align-items:baseline;gap:8px}
.me-line span{font-size:13px;color:var(--muted)}
.me-line b{font-size:20px}
.signin{gap:12px}
.signin .big{font-size:20px}
.acct-list{display:flex;flex-direction:column}
.acct-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.acct-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acct-top small{font-size:11px;color:var(--faint);font-weight:600;margin-left:4px}
.ok{color:var(--green);font-weight:700}
.wait{color:var(--open);font-weight:600}
.tries{margin:0;font-size:12px;color:var(--red);font-weight:600}
.newlink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.newlink input{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--card-2);color:var(--fg);padding:8px;font-size:13px}
.acct-name{border:none;background:none;padding:0;text-align:left;cursor:pointer;font-size:15px;display:flex;align-items:baseline;gap:6px}

.evlog{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}

.evlog li.good{border-left-color:var(--green)} .evlog li.bad{border-left-color:var(--red)}

<body>
<script src="/static/motion.js?v=1"></script>
<script>
// Inside the tracker (pandolfi.bet/#picks) the sheet runs in a frame: the tracker already has the brand and tabs
if (window.self !== window.top || new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');
// ?view=bookie (Will + Pandolfi: slip upload, past slips) or ?view=lm (Will: lines, links, devices, visits).
// The tracker shows these as their own tabs; the pick sheet itself looks the same for everyone.
const VIEW = ['bookie', 'lm'].includes(new URLSearchParams(location.search).get('view')) ? new URLSearchParams(location.search).get('view') : null;
if (VIEW) document.documentElement.classList.add('view-tools');
let lastShown = 0;
window.addEventListener('message', e => {
  if (e.origin === location.origin && e.data && e.data.pbShown && typeof drawSlip === 'function' && S && S.managers && S.managers.length) { SLIPSHOWN = null; freshen(); render(); }
  if (e.origin !== location.origin || !e.data || !e.data.pbShown || Date.now() - lastShown < 60000) return;
  lastShown = Date.now(); fetch('/api/whoami?page=picks', { cache: 'no-store' }).catch(() => {});
});
</script>
<div class="wrap">
  <a class="back" href="/" target="_top">‹ Parlay tracker</a>
  <p class="sandbox" id="sandbox" hidden><b>Test mode.</b> Picks and slips you add here are a private copy. Nobody else sees them, and the real slip is untouched. <a href="/picks">Leave test mode</a></p>
  <div class="brand"><h1>pandolfi.bet</h1><span class="whoami" id="whoami"></span><span class="due" id="due" hidden></span></div>
  <div id="testas"></div>

  <div class="gate" id="gate" hidden><div class="gate-in"><p class="gate-t" id="gateT"></p><p class="gate-b" id="gateB"></p><a class="gate-a" href="/" target="_top">See past parlays ›</a></div></div>

  <div id="main" hidden class="mainwrap">
  <div class="lockbar" id="lockbar" role="status" hidden></div>
  <section class="sec" aria-label="This week's slip">
    <p class="label" id="sliplabel">This week’s slip</p>
    <div class="slip" id="slip"></div>
    <div id="jail"></div>
  </section>


  <section class="sec" aria-label="The slate" id="slateSec">
    <div class="bar">
      <div class="qwrap"><input class="search" id="q" type="search" placeholder="Search a player or team" autocomplete="off" aria-label="Search a player or team"><button type="button" class="qx" id="qx" aria-label="Clear search" hidden>✕</button></div>
      <div class="cats" id="cats"></div>
    </div>
    <div id="slate" class="sec"></div>
    <div class="foot" id="foot"></div>
  </section>

  <details class="writein" id="writein">
    <summary><span><b>Write in your own bet</b><small>Novelty bet, something not on the board, anything</small></span><span class="plus" aria-hidden="true">+</span></summary>
    <form id="wform" class="wform" novalidate>
      <label for="wtext">The bet</label>
      <textarea id="wtext" maxlength="140" rows="2" placeholder="e.g. Coin toss is heads in the Bears game"></textarea>
      <div class="wrow">
        <div><label for="wodds">Odds</label><input id="wodds" inputmode="numeric" autocomplete="off" placeholder="+400"></div>
        <div><label for="wgame">Game (if it's tied to one)</label><select id="wgame"><option value="">Not tied to a game</option></select></div>
      </div>
      <p class="werr" id="werr" hidden></p>
      <button type="submit" class="primary">Lock in my write-in</button>
    </form>
  </details>

  <section class="sec" id="tools" hidden aria-label="League tools">
    <p class="label" id="toolsLabel">League tools</p>
    <div class="card" id="toolsCard"></div>
  </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CATS = [['all', 'All'], ['lines', 'Game lines'], ['atd', 'TD scorer'], ['first_td', '1st TD'], ['tds_over', 'Total TDs'],
  ['pass_yds', 'Pass yds'], ['pass_tds', 'Pass TDs'], ['rush_yds', 'Rush yds'], ['rec_yds', 'Rec yds'], ['rush_rec_yds', 'Rush + rec yds'],
  ['pass_rush_yds', 'Pass + rush yds'], ['receptions', 'Receptions'], ['pass_att', 'Pass att'], ['pass_cmp', 'Completions'],
  ['pass_int', 'INTs thrown'], ['rush_att', 'Rush att']];
const PROP = { atd: 'Anytime TD Scorer', first_td: 'First TD Scorer', tds_over: 'Total TDs', pass_yds: 'Passing Yards', pass_tds: 'Passing TDs',
  rush_yds: 'Rushing Yards', rec_yds: 'Receiving Yards', rush_rec_yds: 'Rush + Rec Yards', pass_rush_yds: 'Pass + Rush Yards',
  receptions: 'Receptions', pass_att: 'Pass Attempts', pass_cmp: 'Pass Completions', pass_int: 'Interceptions Thrown', rush_att: 'Rush Attempts' };
const PRICE_ONLY = new Set(['atd', 'first_td']);   // a yes bet on one player, no over/under
const TEAM = { ARI: 'Cardinals', ATL: 'Falcons', BAL: 'Ravens', BUF: 'Bills', CAR: 'Panthers', CHI: 'Bears', CIN: 'Bengals', CLE: 'Browns', DAL: 'Cowboys', DEN: 'Broncos', DET: 'Lions', GB: 'Packers', HOU: 'Texans', IND: 'Colts', JAX: 'Jaguars', KC: 'Chiefs', LV: 'Raiders', LAC: 'Chargers', LAR: 'Rams', MIA: 'Dolphins', MIN: 'Vikings', NE: 'Patriots', NO: 'Saints', NYG: 'Giants', NYJ: 'Jets', PHI: 'Eagles', PIT: 'Steelers', SF: '49ers', SEA: 'Seahawks', TB: 'Buccaneers', TEN: 'Titans', WSH: 'Commanders' };
let S = { slate: null, picks: {}, managers: [], keySet: true }, me = null, cat = 'all', q = '', ROLE = null, SLIPS = [];
// signed in = this phone holds the cookie from claiming its personal link (the server knows the name; the page never sends one)
let MYNAME = null, testAs = null, INVITE = null, ACCOUNTS = null, NEWLINK = null, OPENACCT = null;
INVITE = new URLSearchParams(location.search).get('invite');
// ?sandbox=1: a private test copy of this week's picks and slips. Nothing here shows up for anyone else.
const SB = new URLSearchParams(location.search).get('sandbox') === '1';
// LM Tools → "Edit": Will changes someone else's real pick (?as=Lou). Works past the lock.
const EDITAS = new URLSearchParams(location.search).get('as');
const editing = () => !!EDITAS && ROLE === 'admin';
const api = path => SB ? path + (path.includes('?') ? '&' : '?') + 'sandbox=1' : path;
let SLIPWEEK = null, SLIPINFO = null, VISITS = null, VMORE = false;
const keyed = (url, opt = {}) => fetch(api(url), Object.assign({ credentials: 'same-origin' }, opt));
const openGames = new Set(), propTab = {};

const fo = o => (o > 0 ? '+' : '') + o;
const dec = o => o > 0 ? 1 + o / 100 : 1 + 100 / -o;
const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tz = { timeZone: 'America/New_York' };
const when = iso => new Date(iso).toLocaleDateString('en-US', { weekday: 'short', ...tz }) + ' ' + new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', ...tz });
const started = g => new Date(g.start) <= new Date();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pt = v => (v > 0 ? '+' : '') + v;
const gname = g => `${g.away} @ ${g.home}`;

// every bettable outcome gets a stable key so a button can show who's on it
function legKey(p) { return p.kind === 'custom' ? 'custom|' + p.sel : [p.gameId, p.kind, p.player || '', p.side || ''].join('|'); }
function whoOn(key) { return Object.entries(S.picks).filter(([, p]) => legKey(p) === key).map(([w]) => w); }

function btn(g, leg, top, bottom) {
  const key = legKey(leg), on = whoOn(key), mine = me && on.includes(me), others = on.filter(w => w !== me);
  const data = esc(JSON.stringify(leg));
  // one leg per bet: once someone has it, the whole button turns their color and nobody else can take it
  const cls = (mine ? ' mine' : others.length ? ' taken' : '') + (mine && JUST === key ? ' bounce' : '');
  const label = leg.sel + ', ' + leg.mkt + ', ' + fo(leg.odds) + (mine ? ', your pick' : others.length ? ', taken by ' + others.join(' and ') : '');
  return `<button type="button" class="btn${cls}" data-leg="${data}"${others.length && !mine ? ` data-taken="${esc(others.join(' & '))}" aria-disabled="true"` : ''} ${started(g) || LOCKED() ? 'disabled' : ''} aria-pressed="${!!mine}" aria-label="${esc(label)}">${top != null ? `<small>${top}</small>` : ''}<b>${fo(bottom)}</b>${mine ? '<span class="on-it">You</span>' : others.length ? `<span class="on-it">${esc(others.join(' & '))}</span>` : ''}</button>`;
}

function linesHTML(g) {
  const L = g.lines || {}, rows = [['away', g.away], ['home', g.home]];
  const base = { gameId: g.id, game: gname(g), start: g.start };
  const cell = (side, abbr) => {
    const sp = L.spread && L.spread[side], ml = L.ml && L.ml[side], t = L.total;
    const tside = side === 'away' ? 'over' : 'under';
    return [
      sp ? btn(g, { ...base, kind: 'spread', side, pt: sp.pt, odds: sp.price, sel: `${abbr} ${TEAM[abbr] || ''} ${pt(sp.pt)}`.replace('  ', ' '), mkt: 'Spread' }, pt(sp.pt), sp.price) : '<span></span>',
      t && t[tside] != null ? btn(g, { ...base, kind: 'total', side: tside, pt: t.pt, odds: t[tside], sel: `${tside === 'over' ? 'Over' : 'Under'} ${t.pt}`, mkt: `Total Points · ${gname(g)}` }, `${tside === 'over' ? 'O' : 'U'} ${t.pt}`, t[tside]) : '<span></span>',
      ml != null ? btn(g, { ...base, kind: 'ml', side, odds: ml, sel: `${abbr} ${TEAM[abbr] || ''}`.trim(), mkt: 'Moneyline' }, null, ml) : '<span></span>'
    ].join('');
  };
  return `<div class="lines"><span></span><span class="h">Spread</span><span class="h">Total</span><span class="h">Money</span>
    ${rows.map(([side, abbr]) => `<span class="tm">${abbr} ${TEAM[abbr] || ''}</span>${cell(side, abbr)}`).join('')}</div>`;
}

function propRows(g, key, filter, inGame) {
  const rows = ((g.props || {})[key] || []).filter(r => !filter || filter(r));
  const base = { gameId: g.id, game: gname(g), start: g.start };
  if (!rows.length) return '';
  return rows.map(r => PRICE_ONLY.has(key)
    ? `<div class="prow one"><span class="pl"><b>${esc(r.player)}</b>${inGame ? '' : `<span>${gname(g)}</span>`}</span>${btn(g, { ...base, kind: key, player: r.player, odds: r.price, sel: r.player, mkt: PROP[key] }, null, r.price)}</div>`
    : r.under == null   // over-only markets, like 2+ TDs
    ? `<div class="prow one"><span class="pl"><b>${esc(r.player)}</b>${inGame ? '' : `<span>${gname(g)}</span>`}</span>${btn(g, { ...base, kind: key, player: r.player, side: 'over', pt: r.pt, odds: r.over, sel: `Over ${r.pt}`, mkt: `${r.player} ${PROP[key]}` }, `O ${r.pt}`, r.over)}</div>`
    : `<div class="prow"><span class="pl"><b>${esc(r.player)}</b>${inGame ? '' : `<span>${gname(g)}</span>`}</span>${
        btn(g, { ...base, kind: key, player: r.player, side: 'over', pt: r.pt, odds: r.over, sel: `Over ${r.pt}`, mkt: `${r.player} ${PROP[key]}` }, `O ${r.pt}`, r.over)}${
        btn(g, { ...base, kind: key, player: r.player, side: 'under', pt: r.pt, odds: r.under, sel: `Under ${r.pt}`, mkt: `${r.player} ${PROP[key]}` }, `U ${r.pt}`, r.under)}</div>`).join('');
}

function gameHTML(g) {
  const keys = Object.keys(PROP).filter(k => (g.props || {})[k] && g.props[k].length);
  const isOpen = openGames.has(g.id), tab = propTab[g.id] || keys[0];
  const props = isOpen ? (keys.length
    ? `<div class="props"><div class="ptabs">${keys.map(k => `<button type="button" data-tab="${k}" data-g="${g.id}" aria-pressed="${k === tab}">${CATS.find(c => c[0] === k)[1]}</button>`).join('')}</div>${propRows(g, tab, null, true)}</div>`
    : `<div class="props"><p class="empty">${started(g) ? 'Game has started.' : 'No player props posted for this game yet.'}</p></div>`) : '';
  return `<article class="game" id="g-${g.id}"><div class="g-head"><b>${g.awayName ? (TEAM[g.away] || g.away) + ' @ ' + (TEAM[g.home] || g.home) : gname(g)}</b><span>${started(g) ? 'Started' : when(g.start)}</span></div>
    ${linesHTML(g)}
    <button type="button" class="more" data-more="${g.id}" aria-expanded="${isOpen}"><span>Player props${keys.length ? ` · ${keys.reduce((n, k) => n + g.props[k].length, 0)}` : ''}</span><span>${isOpen ? '−' : '+'}</span></button>${props}</article>`;
}

function slateHTML() {
  const games = S.slate.games;
  const ql = q.trim().toLowerCase();
  if (cat === 'all' && !ql) return games.map(gameHTML).join('');
  if (cat === 'lines') return games.filter(g => !ql || (g.away + g.home + (TEAM[g.away] || '') + (TEAM[g.home] || '')).toLowerCase().includes(ql))
    .map(g => `<article class="game"><div class="g-head"><b>${TEAM[g.away] || g.away} @ ${TEAM[g.home] || g.home}</b><span>${started(g) ? 'Started' : when(g.start)}</span></div>${linesHTML(g)}</article>`).join('') || '<p class="empty">No games match.</p>';
  // a flat list of props across the slate, filtered by category and/or search
  const keys = cat === 'all' ? Object.keys(PROP) : [cat];
  const match = (g, r) => !ql || r.player.toLowerCase().includes(ql) || (g.away + ' ' + g.home + ' ' + (TEAM[g.away] || '') + ' ' + (TEAM[g.home] || '')).toLowerCase().includes(ql);
  const teamHit = ql ? games.filter(g => (g.away + ' ' + g.home + ' ' + (TEAM[g.away] || '') + ' ' + (TEAM[g.home] || '')).toLowerCase().includes(ql)) : [];
  let out = cat === 'all' && teamHit.length ? teamHit.map(gameHTML).join('') : '';
  keys.forEach(k => {
    const rows = games.map(g => propRows(g, k, r => match(g, r))).join('');
    if (rows) out += `<div class="card"><p class="label">${PROP[k]}</p>${rows}</div>`;
  });
  return out || '<p class="empty">Nothing matches that search.</p>';
}

function oddsCell(p) {
  const changed = p.oddsAtPick != null && p.oddsAtPick !== p.odds;
  const was = changed ? `<small class="was">was ${fo(p.oddsAtPick)}</small>` : '';
  const moved = p.lineNow ? `<small class="was">line now ${p.lineNow.pt > 0 ? '+' : ''}${p.lineNow.pt} (${fo(p.lineNow.odds)})</small>` : '';
  // the price moved since it was picked: the old number rolls out, the new one rolls in, and an arrow says which way
  // (up = it pays more now)
  const o = changed
    ? `<span class="o o-mv"><i class="mv ${dec(p.odds) > dec(p.oddsAtPick) ? 'up' : 'dn'}" aria-hidden="true">${dec(p.odds) > dec(p.oddsAtPick) ? '▲' : '▼'}</i><span class="o-roll"><span class="o-old" aria-hidden="true">${fo(p.oddsAtPick)}</span><span class="o-new">${fo(p.odds)}</span></span></span>`
    : `<span class="o">${fo(p.odds)}</span>`;
  return o + was + moved;
}
function slipHTML() {
  const names = S.managers.filter(n => !inJail(n)), jailed = S.managers.filter(inJail);
  const legs = names.map(n => S.picks[n]).filter(Boolean);
  const total = legs.reduce((d, p) => d * dec(p.odds), 1);
  const odds = legs.length ? Math.round(total >= 2 ? (total - 1) * 100 : -100 / (total - 1)) : null;
  const rows = names.map(n => {
    const p = S.picks[n], mine = n === me;
    return `<div class="sl-row${mine ? ' me' : ''}${mine && p && JUST ? ' slidein' : ''}"><span class="nm">${n}</span>${p
      ? `<span class="pk"><b>${esc(p.sel)}</b><span>${esc([p.mkt.replace(' · ' + p.game, ''), p.game].filter(Boolean).join(' · '))}</span></span><span class="o-wrap"><span class="o-col">${oddsCell(p)}</span>${mine && !LOCKED() ? '<button type="button" class="x" data-clear aria-label="Remove my pick">✕</button>' : ''}</span>`
      : `<span class="none">${mine ? 'Tap any line below' : 'No pick yet'}</span><span></span>`}</div>`;
  }).join('');
  return `<div class="slip-h"><h2>${S.weekNo ? 'Wk ' + S.weekNo + ' · ' : ''}${legs.length} Pick Parlay</h2>${odds != null ? `<span class="sep"></span><span class="odds" id="slipodds">${fo(odds)}</span>` : ''}<span class="pay">$10 pays<b id="slippay">${legs.length ? money(10 * total) : '—'}</b></span></div>
    <div class="pips">${names.map(n => `<i class="${S.picks[n] ? 'on' : ''}" data-n="${esc(n)}"></i>`).join('')}</div>${rows}`;
}
// Parlay Jail (Constitution §7): no leg on the slip, but an escape pick every week until one hits
function jailHTML(jailed) {
  if (!jailed.length) return '';
  const rows = jailed.map(n => {
    const p = S.picks[n], mine = n === me;
    return `<div class="sl-row jail${mine ? ' me' : ''}${mine && p && JUST ? ' slidein' : ''}"><span class="nm">${n}</span>${p
      ? `<span class="pk"><b>${esc(p.sel)}</b><span>${esc([p.mkt.replace(' · ' + p.game, ''), p.game].filter(Boolean).join(' · '))}</span></span><span class="o-wrap"><span class="o-col">${oddsCell(p)}</span>${mine && !LOCKED() ? '<button type="button" class="x" data-clear aria-label="Remove my escape pick">✕</button>' : ''}</span>`
      : `<span class="none">${mine ? 'Tap any line below for your escape pick' : 'No escape pick yet'}</span><span></span>`}</div>`;
  }).join('');
  const meIn = inJail(me);
  return `<div class="jail-box"><div class="jail-h"><b>Parlay Jail</b></div>
    <p class="jail-note">A hit here gets ${meIn ? 'you' : 'them'} back in the ’lay for Week ${S.weekNo + 1}</p>${rows}</div>`;
}

function render() {
  me = editing() ? EDITAS : SB && ROLE === 'admin' ? (testAs || MYNAME) : MYNAME;
  lockUI();
  acctHTML();
  drawSlip();
  document.getElementById('jail').innerHTML = jailHTML(S.managers.filter(inJail));   // its own box, clearly off the slip
  if (S.weekNo) document.getElementById('sliplabel').textContent = `Week ${S.weekNo} slip`;
  const sl = document.getElementById('slate'), foot = document.getElementById('foot'), bar = document.querySelector('.bar');
  if (!S.slate || !S.slate.games || !S.slate.games.length) {
    bar.hidden = true;
    sl.innerHTML = `<div class="card"><p><b>${S.weekNo ? `Week ${S.weekNo} lines aren’t up yet.` : 'No lines pulled yet this week.'}</b></p><p class="hint">${S.weekNo ? `Week ${S.weekNo - 1}’s slip is in. ` : ''}DraftKings lines and player props go up here automatically Tuesday morning. You can write in your own bet below now.</p></div>`;
    toolsHTML();
    foot.innerHTML = '';
    return;
  }
  bar.hidden = false;
  document.getElementById('cats').innerHTML = CATS.map(([k, l]) => `<button type="button" data-cat="${k}" aria-pressed="${k === cat}">${l}</button>`).join('');
  sl.innerHTML = slateHTML();
  const f = S.slate;
  foot.innerHTML = `<span>DraftKings lines from ${when(f.fetched)}.${f.linesOnly ? ' Player props post Tuesday morning.' : ''} Final odds are whatever the slip says.</span>`;
  toolsHTML();
}

// "picks due in 08:24:11", ticking to Wednesday 11:59 PM ET; the red locked banner takes over after that
let dueTimer = null;
function dueTick() {
  const el = document.getElementById('due');
  const left = S.deadline ? Date.parse(S.deadline) - Date.now() : NaN;
  if (!S.deadline || LOCKED() || VIEW || !(left > 0)) {
    el.hidden = true;
    if (S.deadline && left <= 0 && !S.locked && S.lockOverride !== 'open') { S.locked = true; render(); }   // the deadline passed while the page was open
    return;
  }
  const t = Math.floor(left / 1000), hh = Math.floor(t / 3600), mm = Math.floor(t % 3600 / 60), ss = t % 60;
  el.hidden = false;
  // red inside the last day; brighter and pulsing inside the last two hours; a heartbeat in the last ten minutes
  el.className = 'due' + (t < 2 * 3600 ? ' last' : t < 24 * 3600 ? ' soon' : '') + (t < 600 ? ' final' : '');
  const txt = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  let b = el.querySelector('b');
  if (!b || b.childElementCount !== txt.length) { el.innerHTML = `<small>picks due in</small><b aria-label="${txt}">${[...txt].map(c => c === ':' ? `<i class="c">:</i>` : `<i>${c}</i>`).join('')}</b>`; return; }
  b.setAttribute('aria-label', txt);
  [...txt].forEach((c, i) => { const d = b.children[i]; if (d.textContent !== c) { d.textContent = c; d.classList.remove('flip'); void d.offsetWidth; d.classList.add('flip'); } });
}
// the slip header: the parlay odds spin like a slot machine every time the sheet opens; after that,
// adding or dropping a leg rolls the odds and the payout like an odometer and pops the new pip
let SLIPSHOWN = null, FRESH_T = null;
function drawSlip() {
  const was = SLIPSHOWN;
  document.getElementById('slip').innerHTML = slipHTML();
  const odds = document.getElementById('slipodds'), pay = document.getElementById('slippay');
  const now = { odds: odds ? odds.textContent : '', pay: pay ? pay.textContent : '', on: [...document.querySelectorAll('#slip .pips i.on')].map(i => i.dataset.n) };
  SLIPSHOWN = now;
  if (!window.Motion) return;
  if (!was) { Motion.slot(odds, 1050); Motion.roll(pay, now.pay, now.pay.replace(/\d/g, '0')); return; }
  if (was.odds !== now.odds && odds) Motion.roll(odds, now.odds, was.odds);
  if (was.pay !== now.pay && pay) Motion.roll(pay, now.pay, was.pay);
  document.querySelectorAll('#slip .pips i.on').forEach(i => { if (!was.on.includes(i.dataset.n)) i.classList.add('pop'); });
}
// every time the sheet is opened: replay the opening motion (slot, line moves, jail bars, lock)
function freshen() {
  if (Motion && Motion.calm()) return;
  const h = document.documentElement; h.classList.remove('fresh'); void h.offsetWidth; h.classList.add('fresh');
  clearTimeout(FRESH_T); FRESH_T = setTimeout(() => h.classList.remove('fresh'), 2600);
}
function lockUI() {
  if (!dueTimer) dueTimer = setInterval(dueTick, 1000);
  dueTick();
  const on = LOCKED();
  document.documentElement.classList.toggle('locked', on);
  const b = document.getElementById('lockbar');
  b.hidden = !on;
  if (on) b.innerHTML = `<b><svg class="padlock" viewBox="0 0 16 18" aria-hidden="true"><path class="sh" d="M4.5 8V5.5a3.5 3.5 0 0 1 7 0V8"/><rect class="bd" x="2" y="8" width="12" height="9" rx="2"/></svg>Picks are locked</b><span>The deadline passed ${S.deadline ? new Date(S.deadline).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', ...tz }) : 'Wed 11:59 PM'}. You can still look around. Week ${(S.weekNo || 0) + 1} picks open when the slip goes in.</span>`;
  const wf = document.getElementById('wform'); if (wf) wf.querySelectorAll('textarea,input,select,button').forEach(x => { x.disabled = on; });
  try { if (window.self !== window.top) window.parent.postMessage({ pbLocked: on }, location.origin); } catch (e) {}
}
function toolsHTML() {
  const box = document.getElementById('tools');
  const allowed = VIEW === 'bookie' ? ['admin', 'slip'].includes(ROLE) : VIEW === 'lm' ? ROLE === 'admin' : false;
  box.hidden = !VIEW;
  if (!VIEW) return;
  document.getElementById('toolsLabel').textContent = VIEW === 'bookie' ? 'Bookie tools' : 'LM tools';
  // LM: sections stack on their own (no outer card); Bookie stays one card
  const lmOk = VIEW === 'lm' && ROLE === 'admin';
  document.getElementById('toolsCard').className = lmOk ? 'lm-secs' : 'card';
  document.getElementById('toolsLabel').hidden = lmOk;
  if (!allowed) { document.getElementById('toolsCard').innerHTML = `<p class="hint">${VIEW === 'bookie' ? 'Only Will and Pandolfi can see this.' : 'Only Will can see this.'}</p>`; return; }
  const f = S.slate;
  const pull = ROLE === 'admin' ? `<div class="tool-row"><span class="hint">${f ? `Lines pulled ${when(f.fetched)}${f.creditsLeft != null ? ` · ${f.creditsLeft} API credits left` : ''}. Auto-pulls Tue 10 AM, props top-up Wed 10 AM.` : `${S.weekNo ? 'Week ' + S.weekNo + ' lines' : 'Lines'} auto-pull Tue 10 AM (game lines may come sooner if DraftKings has them up).`}</span></div>` : '';
  const thumbsFor = (wk, names) => `<div class="slips">${names.map(n => { const u = `/api/slips/${wk}/${n}`; return `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Uploaded slip" loading="lazy"></a>`; }).join('')}</div>`;
  const thumbs = SLIPS.length ? thumbsFor(SLIPWEEK, SLIPS) : '';
  const past = (SLIPINFO && SLIPINFO.past || []);
  const gallery = past.length ? `<details class="past-slips"><summary>Past slips <small>${past.length} week${past.length === 1 ? '' : 's'}</small></summary>${past.map(x => `<p class="hint"><b style="color:var(--fg)">Week ${x.weekNo}</b> · ${x.slips.length} screenshot${x.slips.length === 1 ? '' : 's'}</p>${thumbsFor(x.week, x.slips)}`).join('')}</details>` : '';
  document.getElementById('toolsCard').innerHTML = VIEW === 'bookie' ? `
    <p class="hint"><b style="color:var(--fg)">Placed the bet?</b> Upload the DraftKings slip screenshots. The week goes on the tracker right away, the real odds come off the slip, and picks open for next week.</p>
    <label class="filebtn">Upload slip screenshots<input type="file" id="slipfile" accept="image/*" multiple></label>
    ${slipStatus() ? `<p class="hint">${slipStatus()}</p>` : ''}${thumbs}${gallery}` : lmSections(pull);
}

const ago = iso => iso ? new Date(iso).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', ...tz }) : '';
// opens = times the personal link itself was opened (not link issuance, not later visits to the pick sheet)
const nOpens = a => a.events.filter(e => !/^New link|^Visited/.test(e.kind)).length;
// LM Tools come as separate sections, each its own card, instead of one long card
function lmSections(pull) {
  const part = (title, body) => body ? `<div class="sec"><p class="label">${title}</p><div class="card">${body}</div></div>` : '';
  return part(`Pick lock · Week ${S.weekNo || ''}`, lockToolHTML()) + part('Edit a pick', editToolHTML()) + part('Lines', pull)
    + part('Accounts', accountsHTML()) + part('Site visits', visitsHTML());
}
// LM Tools: override this week's lock (unlock past the deadline, or lock early); back to automatic any time
function lockToolHTML() {
  const due = S.deadline ? new Date(S.deadline).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET' : 'Wed 11:59 PM ET';
  const o = S.lockOverride;
  const st = o === 'open' ? 'Unlocked by you. The deadline is ignored until you lock it.' : o === 'locked' ? 'Locked by you.' : S.locked ? `Locked automatically at ${due}.` : `Open. Locks automatically ${due}.`;
  const btns = (S.locked ? `<button type="button" class="ghost" data-lock="open">Unlock picks</button>` : `<button type="button" class="ghost" data-lock="locked">Lock picks now</button>`)
    + (o ? `<button type="button" class="ghost" data-lock="auto">Back to automatic</button>` : '');
  return `<div class="tool-row"><div><span class="lockstate ${S.locked ? 'on' : 'off'}">${S.locked ? 'Locked' : 'Open'}</span><p class="hint">${st}</p></div><div class="lock-btns">${btns}</div></div>`;
}
// LM Tools: change anyone's real pick for this week (opens the pick sheet as them)
function editToolHTML() {
  const base = document.documentElement.classList.contains('embed') ? '?embed=1&as=' : '?as=';
  const rows = (S.managers || []).map(n => {
    const p = S.picks[n];
    const what = p ? `${esc(p.sel)} · ${esc(p.mkt || '')} ${p.odds != null ? '(' + fo(p.odds) + ')' : ''}` : inJail(n) ? 'In Parlay Jail · no escape pick yet' : 'No pick yet';
    return `<div class="lm-pick"><div><b>${esc(n)}${inJail(n) ? ' <small style="color:var(--muted);font-weight:500">· jail</small>' : ''}</b><span>${what}</span></div><a class="ghost" href="${base}${encodeURIComponent(n)}">Edit</a></div>`;
  }).join('');
  return `<p class="hint">Changes their real leg for Week ${S.weekNo || ''}, even after the lock.</p><div class="lm-picks">${rows}</div>`;
}
function accountsHTML() {
  if (!ACCOUNTS) return '<p class="hint">Loading accounts…</p>';
  const rows = ACCOUNTS.map(a => {
    const st = a.device ? `<span class="ok">Linked</span> ${esc(a.device)} · ${ago(a.claimed)}${a.lastSeen ? `<br>Last on the site ${ago(a.lastSeen)}` : ''}` : a.invited ? '<span class="wait">Link sent, not opened yet</span>' : '<span class="wait">No link yet</span>';
    const tries = a.attempts.length ? `<p class="tries">Link reopened ${a.attempts.length}×, refused. Last: ${esc(a.attempts[a.attempts.length - 1].device)} · ${ago(a.attempts[a.attempts.length - 1].at)}</p>` : '';
    const nl = NEWLINK && NEWLINK.name === a.name ? `<div class="newlink"><input readonly value="${NEWLINK.link}" aria-label="New link for ${a.name}"><button type="button" class="ghost" data-copy="${NEWLINK.link}">Copy</button></div>` : '';
    const open = OPENACCT === a.name;
    const log = open ? `<ol class="evlog">${a.events.slice().reverse().map(e => `<li class="${/Refused|Blocked/.test(e.kind) ? 'bad' : /Signed in|Visited|Reopened/.test(e.kind) ? 'good' : ''}"><div><b>${esc(e.kind)}</b><span>${ago(e.at)}</span></div>${e.device ? `<p>${esc(e.device)}${e.ip ? ' · IP ' + esc(e.ip) : ''}</p><p class="ua">${esc(e.ua)}</p>` : ''}</li>`).join('') || '<li><p>No activity yet</p></li>'}</ol>` : '';
    return `<div class="acct-row"><div class="acct-top"><button type="button" class="acct-name" data-acct="${a.name}" aria-expanded="${open}"><b>${a.name}</b>${a.role ? ` <small>${a.role === 'admin' ? 'admin' : 'uploads slips'}</small>` : ''} <small>· ${nOpens(a)} open${nOpens(a) === 1 ? '' : 's'} ${open ? '▴' : '▾'}</small></button><button type="button" class="ghost" data-reset="${a.name}">${a.invited ? 'New link' : 'Make link'}</button></div><p class="hint">${st}</p>${tries}${nl}${log}</div>`;
  }).join('');
  return `<p class="hint">Each link works once, on the first phone that signs in. "New link" signs that person's current phone out.</p><div class="acct-list">${rows}</div>`;
}
async function loadAccounts() {
  if (ROLE !== 'admin') return;
  try { ACCOUNTS = (await (await keyed('/api/admin/accounts', { cache: 'no-store' })).json()).accounts; } catch (e) {}
  toolsHTML();
}

// ---------- sign-in ----------
const UA = navigator.userAgent;
const isPhone = /iPhone|Android|iPad/.test(UA) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(UA));
const inApp = /Instagram|FBAN|FBAV|Snapchat|LinkedInApp|Twitter|TikTok|GSA\//.test(UA);
function acctHTML() {
  document.getElementById('whoami').innerHTML = me ? `<small>${editing() ? 'editing' : 'picking as'}</small><b${editing() ? ' class="editing"' : ''}>${esc(me)}</b>` : '';
  const back = (document.documentElement.classList.contains('embed') ? '?embed=1&' : '?') + 'view=lm';
  document.getElementById('testas').innerHTML = editing()
    ? `<div class="editbar"><span>Editing ${esc(me)}’s real pick. Tap a leg to change it, × to clear it.</span><a href="${back}">Done</a></div>`
    : SB && ROLE === 'admin'
    ? `<p class="hint">Test mode: pick as anyone</p><div class="who">${S.managers.map(n => `<button type="button" data-testas="${n}" aria-pressed="${n === me}">${n}</button>`).join('')}</div>` : '';
}
function gate(title, body) {
  document.getElementById('gateT').textContent = title;
  document.getElementById('gateB').textContent = body;
  document.getElementById('gate').hidden = false;
  document.getElementById('main').hidden = true;
}
// a personal link signs this phone in the moment it opens; nothing to tap
async function autoClaim() {
  const seen = why => fetch('/api/invite/' + encodeURIComponent(INVITE) + '/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ why }) }).catch(() => {});
  if (!isPhone) { seen('desktop'); return gate('Open this on your phone', 'Your link locks to the first phone that opens it. Text it to yourself and open it on the phone you pick from.'); }
  if (inApp) { seen('inapp'); return gate('Open in Safari or Chrome', 'This is an app’s built-in browser. Tap ••• (or the share icon) and choose Open in Safari or Chrome. Your link hasn’t been used yet.'); }
  try {
    const r = await fetch('/api/invite/' + encodeURIComponent(INVITE) + '/claim', { method: 'POST' }); const d = await r.json();
    if (r.status === 409) return gate('Link already used', `${d.name}’s link was opened on another phone or browser first. If that wasn’t you, tell Will.`);
    if (!r.ok) return gate('Link doesn’t work', d.error || 'Ask Will for a new link.');
    MYNAME = d.name; ROLE = d.role;
  } catch (e) { return gate('Couldn’t connect', 'Check your signal and open the link again.'); }
  INVITE = null;
  history.replaceState(null, '', location.pathname + (SB ? '?sandbox=1' : ''));
  return true;
}


const weekNoOf = key => Math.floor((Date.parse(key.slice(0, 10)) - Date.parse('2026-09-08')) / 6048e5) + 1;
function slipStatus() {
  const i = SLIPINFO || {}, r = i.reading;
  if (r && r.reading) return 'Reading the slip for the real odds…';
  if (r && r.error) return esc(r.error);
  if (r) return 'Slip read. The tracker has the real odds.';
  return i.claudeKey === false ? 'Odds on the tracker are from the pick sheet (no Claude key on the server to read slips).' : '';
}
// ---------- site visits (Will only) ----------
async function loadVisits() {
  if (ROLE !== 'admin') return;
  try { VISITS = (await (await keyed('/api/admin/access', { cache: 'no-store' })).json()).visits; } catch (e) {}
  toolsHTML();
}
const short = iso => new Date(iso).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', ...tz });
function visitsHTML() {
  if (!VISITS) return '<p class="hint">Loading…</p>';
  const weekAgo = Date.now() - 7 * 864e5;
  const sum = S.managers.map(n => {
    const mine = VISITS.filter(v => v.who === n), recent = mine.filter(v => Date.parse(v.at) > weekAgo);
    return `<div><b>${n}</b><span class="${mine.length ? '' : 'cold'}">${mine.length ? `${recent.length} visit${recent.length === 1 ? '' : 's'} this week · last ${short(mine[0].at)}` : 'No visits yet'}</span></div>`;
  }).join('');
  const list = VISITS.slice(0, VMORE ? 400 : 40).map(v => `<li class="${v.who ? '' : 'anon'}"><b>${v.who ? esc(v.who) : 'Not signed in'}</b><em>${ago(v.at)}</em><span>${v.page === 'picks' ? 'Pick sheet' : 'Tracker'} · ${esc(v.device)}${v.who ? '' : v.ip ? ' · IP ' + esc(v.ip) : ''}</span></li>`).join('');
  return `<p class="hint">Every time someone opens the tracker or pick sheet (reloads within a minute count once). Visits started being logged Oct 30.</p>
    <div class="visits"><div class="vsum">${sum}</div><ol class="vlist">${list || '<li><span>No visits yet</span></li>'}</ol>${VISITS.length > 40 ? `<button type="button" class="ghost" data-vmore>${VMORE ? 'Show fewer' : `Show all ${VISITS.length}`}</button>` : ''}</div>`;
}
async function loadSlips() {
  if (!ROLE) return;
  try { const d = await (await keyed('/api/slips', { cache: 'no-store' })).json(); SLIPS = d.slips || []; SLIPWEEK = d.week; SLIPINFO = d; } catch (e) {}
  toolsHTML();
}

const toastEl = document.getElementById('toast'); let toastT;
let JUST = null;
// ?locked=1: Will can preview the locked look without waiting for Wednesday night
const PREVIEW_LOCK = new URLSearchParams(location.search).get('locked') === '1';
const LOCKED = () => !!S.locked && !editing();
const inJail = n => (S.jail || []).includes(n);
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200); }

async function save(pick) {
  if (LOCKED()) { toast('Picks are locked. They reopen when the slip goes in.'); return; }
  if (!me) { toast('Open your personal link from Will to make picks'); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const prev = S.picks[me];
  if (pick) S.picks[me] = pick; else delete S.picks[me];
  JUST = pick ? legKey(pick) : null;   // the button bounces and your name slides onto the slip, once
  render(); JUST = null;
  try {
    const r = await fetch('/api/picks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ who: SB || editing() ? me : undefined, pick, sandbox: SB, edit: editing() || undefined }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Save failed');
    S.picks = d.picks; setTimeout(render, pick ? 500 : 0);   // let the bounce finish before redrawing
    toast(editing() ? (pick ? `${me}'s pick: ${pick.sel}` : `${me}'s pick removed`) : pick ? `Locked in: ${pick.sel}` : 'Pick removed');
  } catch (e) {
    if (prev) S.picks[me] = prev; else delete S.picks[me];
    render(); toast(e.message || 'Couldn’t save. Try again.');
  }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-vmore')) { VMORE = !VMORE; toolsHTML(); return; }
  if (t.dataset.acct) { OPENACCT = OPENACCT === t.dataset.acct ? null : t.dataset.acct; toolsHTML(); return; }
  if (t.dataset.testas) { testAs = t.dataset.testas; render(); return; }
  if (t.dataset.lock) {
    t.disabled = true;
    try {
      const r = await keyed('/api/admin/lock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: t.dataset.lock }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      S.locked = d.locked; S.lockOverride = d.lockOverride; render();
      toast(d.lockOverride === 'open' ? 'Picks unlocked' : d.lockOverride === 'locked' ? 'Picks locked' : 'Lock back on the Wednesday deadline');
    } catch (err) { t.disabled = false; toast(err.message || 'Couldn’t change the lock'); }
    return;
  }
  if (t.dataset.reset) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Tap again to confirm'; return; }
    try { const r = await keyed('/api/admin/accounts/' + encodeURIComponent(t.dataset.reset) + '/reset', { method: 'POST' }); const d = await r.json(); if (!r.ok) throw new Error(d.error); NEWLINK = d; await loadAccounts(); toast('New link ready. Copy it and text it.'); }
    catch (err) { toast(err.message || 'Couldn’t make a link'); }
    return;
  }
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(t.dataset.copy); toast('Copied'); } catch (err) { const i = t.previousElementSibling; i.select(); toast('Selected. Copy it from the box.'); }
    return;
  }
  if (t.dataset.cat) { cat = t.dataset.cat; render(); return; }
  if (t.dataset.more) { openGames.has(t.dataset.more) ? openGames.delete(t.dataset.more) : openGames.add(t.dataset.more); render(); return; }
  if (t.dataset.tab) { propTab[t.dataset.g] = t.dataset.tab; render(); return; }
  if (t.hasAttribute('data-clear')) { save(null); return; }
  if (t.dataset.taken) { toast(`${t.dataset.taken} already has that one. Pick a different leg.`); return; }
  if (t.dataset.leg) {
    const leg = JSON.parse(t.dataset.leg);
    const cur = me && S.picks[me];
    save(cur && legKey(cur) === legKey(leg) ? null : leg);   // tapping your own pick again removes it
    return;
  }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'slipfile' || !e.target.files.length) return;
  const fd = new FormData(); [...e.target.files].forEach(f => fd.append('slip', f));
  toast('Uploading…');
  try {
    const r = await keyed('/api/slips', { method: 'POST', body: fd }); const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    SLIPS = d.slips; SLIPWEEK = d.week; toolsHTML();
    toast(`Week ${d.weekNo} is on the tracker. Picks are open for Week ${d.pickWeekNo}.`);
    setTimeout(load, 1200);
  } catch (err) { toast(err.message || 'Upload failed'); }
});
document.getElementById('wform').addEventListener('submit', e => {
  e.preventDefault();
  const err = document.getElementById('werr'), text = document.getElementById('wtext').value.trim();
  let raw = document.getElementById('wodds').value.replace(/\s/g, ''), odds = parseInt(raw, 10);
  if (!/^[+-]?\d+$/.test(raw)) odds = NaN;
  const show = m => { err.textContent = m; err.hidden = false; };
  if (!me) return show('Open your personal link from Will first.');
  if (!text) return show('Write out the bet.');
  if (isNaN(odds) || Math.abs(odds) < 100) return show('Odds look like +400 or -150.');
  err.hidden = true;
  const gid = document.getElementById('wgame').value, g = S.slate && S.slate.games.find(x => x.id === gid);
  save({ kind: 'custom', sel: text, mkt: 'Write-in', odds, gameId: g ? g.id : null, game: g ? gname(g) : null, start: g ? g.start : null });
  document.getElementById('writein').open = false;
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value; document.getElementById('qx').hidden = !q; document.getElementById('slate').innerHTML = slateHTML(); });
document.getElementById('qx').addEventListener('click', () => {
  const box = document.getElementById('q'); box.value = ''; q = ''; document.getElementById('qx').hidden = true;
  document.getElementById('slate').innerHTML = slateHTML();
});

async function load() {
  // framed in the tracker, the sheet preloads in the background: only count a visit when the tab is actually opened
  const EMBED = document.documentElement.classList.contains('embed');
  try { const w = await (await keyed('/api/whoami' + (EMBED ? '' : '?page=picks'), { cache: 'no-store' })).json(); MYNAME = w.name; ROLE = w.role; } catch (e) {}
  if (INVITE && !MYNAME) { if (await autoClaim() !== true) return; }
  else if (INVITE) { fetch('/api/invite/' + encodeURIComponent(INVITE) + '/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ why: 'same' }) }).catch(() => {}); INVITE = null; history.replaceState(null, '', location.pathname + (SB ? '?sandbox=1' : '')); }
  if (!MYNAME) return gate('Make picks on your phone', 'Visit pandolfi.bet/picks from your phone to make picks.');
  document.getElementById('main').hidden = false;
  try {
    const r = await fetch(api('/api/odds/nfl'), { cache: 'no-store' });
    const d = await r.json();
    S.slate = d.slate; S.picks = d.picks || {}; S.managers = d.managers; S.keySet = d.keySet; S.weekNo = d.weekNo;
    S.jail = d.jail || []; S.deadline = d.deadline; S.locked = !!d.locked || (PREVIEW_LOCK && ROLE === 'admin'); S.lockOverride = d.lockOverride || null;
    const sel = document.getElementById('wgame');
    if (S.slate && S.slate.games) sel.innerHTML = '<option value="">Not tied to a game</option>' + S.slate.games.map(g => `<option value="${g.id}">${TEAM[g.away] || g.away} @ ${TEAM[g.home] || g.home} · ${when(g.start)}</option>`).join('');
    freshen(); render();
    if (VIEW === "bookie") loadSlips(); else if (VIEW === "lm") { loadAccounts(); loadVisits(); }
  } catch (e) { document.getElementById('slate').innerHTML = '<p class="empty">Couldn’t load the slate. Refresh to try again.</p>'; }
}
document.getElementById('sandbox').hidden = !SB;
load();
// pick up teammates' picks without a reload
setInterval(async () => {
  if (document.hidden || !MYNAME) return;
  try { const d = await (await fetch(api('/api/odds/nfl'), { cache: 'no-store' })).json(); if (JSON.stringify(d.picks) !== JSON.stringify(S.picks)) { S.picks = d.picks || {}; drawSlip(); if (!q) document.getElementById('slate').innerHTML = S.slate ? slateHTML() : ''; } } catch (e) {}
}, 30000);
</script>
