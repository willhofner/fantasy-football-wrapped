<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/static/favicon.png">
<title>GSB Week 7 Sweat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
html{background:#0B0B0B}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: a "My Bets" screen. Up-next game rail, then the ticket: header, legs as rows (tap to expand), footer. Settled rows tint by result. */
:root{
  --bg:#0B0B0B; --card:#1C1C1C; --card-2:#262626; --line:#2E2E2E; --fg:#FFFFFF; --muted:#A8A8A8; --faint:#6E6E6E;
  --green:#53D337; --green-ink:#0A1A05; --green-tint:#172814; --green-tint-2:#1F3A19; --green-line:#2F5A26;
  --red:#FF5147; --red-tint:#2A1513; --red-line:#5A2420;
  --open:#F5C02E; --open-tint:#3A300E; --gold:#F5C02E; --live-tint:#2A2510; --live-line:#6B5A1C;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:Barlow,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.3}
button{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--body);font-weight:700;font-size:24px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.label{font-size:12px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin:0}

/* up-next rail */
.rail{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;width:max-content}
.chip{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:10px;background:var(--card);text-decoration:none;color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip .g{font-weight:700;font-size:14px}
.chip .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.hit{background:var(--green-tint);border-color:var(--green-line)}
.chip.hit .t{color:var(--green)}
.chip.live{background:var(--live-tint);border-color:var(--live-line)}
.chip.live .t{color:var(--open)}
.row.live{background:var(--live-tint)}
.row.live .who{background:rgba(245,192,46,.18);color:var(--open)}
.row.live .board{background:rgba(0,0,0,.28)}
.bug{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;background:rgba(0,0,0,.32);border-radius:10px;padding:10px 12px}
.bug-score{display:flex;flex-direction:column;gap:4px}
.bug-score div{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.bug-score b{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.bug-state{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.inn{font-weight:800;font-size:14px;color:var(--open);white-space:nowrap}
.outs{display:flex;align-items:center;gap:4px}
.outs i{width:9px;height:9px;border-radius:50%;border:2px solid var(--faint)}
.outs i.on{background:var(--open);border-color:var(--open)}
.outs em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.diamond{width:80px;height:64px;display:block}
.pas{display:flex;flex-direction:column;gap:6px}
.pas div{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;font-size:13px;align-items:baseline}
.pas span{color:var(--muted);font-weight:600}
.pas em{font-style:normal;color:var(--open);font-weight:700}
.smp{font-size:10px;letter-spacing:.6px;background:var(--open);color:#1A1400;padding:1px 5px;border-radius:3px;margin-right:4px}

/* ticket */
.ticket{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ticket.won{background:var(--green-tint);border-color:var(--green)}
.ticket.lost{background:var(--red-tint);border-color:var(--red-line)}
.t-head{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.t-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t-title h2{margin:0;font-size:20px;font-weight:700}
.t-title .sep{width:1px;height:16px;background:var(--faint)}
.t-title .odds{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{margin-left:auto;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
.pill.open{background:var(--open-tint);color:var(--open)}
.pill.won{background:var(--green);color:var(--green-ink)}
.pill.lost{background:var(--red);color:#1A0504}
.t-sum{font-size:13px;color:var(--muted);margin:0}
.t-money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.t-money div{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-money small{font-size:12px;font-weight:600;color:var(--muted)}
.t-money b{color:var(--fg);font-weight:700;font-size:19px}
.stat{margin:0;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.prog-top span:last-child{color:var(--muted);font-weight:500}
.pips{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.pips i{height:5px;border-radius:3px;background:var(--card-2)}
.pips i.hit{background:var(--green)} .pips i.miss{background:var(--red)} .pips i.live{background:var(--open)}

/* legs */
.legs{display:flex;flex-direction:column}
.row{display:block;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);padding:0;cursor:pointer}
.row.hit{background:var(--green-tint)}
.row.miss{background:var(--red-tint)}
.row-main{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px}
.ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ico.open{border:2px solid var(--open);border-radius:50%;width:22px;height:22px;margin:4px 3px}
.ico.hit{background:var(--green-tint-2)}
.ico.hit svg{stroke:var(--green)}
.ico.miss{background:var(--red-tint)}
.ico.miss svg{stroke:var(--red)}
.ico.live{border:2px solid var(--open);border-radius:50%;width:22px;height:22px;margin:4px 3px;background:var(--open-tint)}
.sel{display:flex;flex-direction:column;gap:2px;min-width:0}
.sel b{font-size:16px;font-weight:700}
.sel span{font-size:13px;color:var(--muted)}
.sel .meta{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.who{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:4px;background:var(--card-2);color:var(--muted);margin-right:6px;vertical-align:1px}
.row.hit .who{background:var(--green-tint-2);color:var(--green)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.right .o{font-size:15px;font-weight:600;color:var(--muted)}
.row.hit .right .o{color:var(--green)}
.right .v{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.mini{grid-column:2 / 4;height:4px;border-radius:2px;background:var(--card-2);position:relative;margin-top:-2px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--faint)}
.mini b{position:absolute;top:-3px;width:2px;height:10px;background:var(--fg)}
.row.hit .mini{background:var(--green-tint-2)} .row.hit .mini i{background:var(--green)}
.row.miss .mini i{background:var(--red)}
.row.live .mini i{background:var(--open)}

/* group (SGP) */
.grp-head{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;border-top:1px solid var(--line)}
.grp-head b{font-size:16px}
.grp-head .sep{width:1px;height:14px;background:var(--faint)}
.grp-head span{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-head.hit{background:var(--green-tint)}
.grp-head.hit span{color:var(--green)}
.grp .row{border-top:none}

/* expanded details */
.detail{padding:0 16px 14px 56px;display:flex;flex-direction:column;gap:12px}
.board{background:var(--card-2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.row.hit .board,.grp-detail.hit .board{background:rgba(0,0,0,.28)}
.board table{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-size:12px;font-weight:500;color:var(--muted);text-align:center;padding:0 0 6px;width:30px}
.board th:first-child{text-align:left;width:auto}
.board td{text-align:center;padding:4px 0;font-family:var(--display);font-size:17px;font-weight:600}
.board td:first-child{text-align:left;font-family:var(--body);font-size:15px;font-weight:600}
.board td.tot{color:var(--gold);font-weight:800}
.pre-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.pre-strip span:nth-child(2){font-weight:500;color:var(--muted);font-size:14px}
.big{display:flex;flex-direction:column;gap:6px}
.big-top{display:flex;justify-content:space-between;align-items:baseline}
.big-top b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big-top b small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.big-top span{font-size:13px;font-weight:800;letter-spacing:.6px}
.trk{position:relative;height:26px}
.trk .ln{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--card-2)}
.row.hit .trk .ln{background:rgba(0,0,0,.35)}
.trk .fl{position:absolute;left:0;top:11px;height:4px;border-radius:2px;background:var(--faint)}
.trk .fl.hit{background:var(--green)} .trk .fl.miss{background:var(--red)} .trk .fl.live{background:var(--open)}
.trk .st{position:absolute;top:9px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:2px solid var(--muted);transform:translateX(-4px)}
.trk .tg{position:absolute;top:2px;width:2px;height:22px;background:var(--fg);transform:translateX(-1px)}
.trk .dt{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;transform:translateX(-8px);border:3px solid var(--card);background:var(--faint)}
.row.hit .trk .dt{border-color:var(--green-tint)}
.trk .dt.hit{background:var(--green)} .trk .dt.miss{background:var(--red)} .trk .dt.live{background:var(--open)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.est{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--faint);text-transform:uppercase}
.pline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.pline div{background:rgba(0,0,0,.28);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pline b{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.pline small{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
.rx{display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:12px}
.rx-h{margin:0;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.rx-row{display:flex;flex-direction:column;gap:5px}
.rx-top{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.rx-top b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx-top span{font-size:12px;color:var(--muted)}
.rx-top em{font-style:normal;color:var(--green);font-weight:700}
.rx-top strong{font-family:var(--display);font-size:20px;font-weight:700;text-align:right;line-height:1}
.rx-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06)}
.rx-bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.field{display:flex;flex-direction:column;gap:6px}
.field svg{width:100%;max-width:100%;height:auto;display:block;border-radius:8px}
.tl{position:relative;height:104px;margin:4px 0 0}
.tl-ax{position:absolute;left:0;right:0;top:46px;height:2px;background:var(--faint)}
.tl-div{position:absolute;top:36px;width:1px;height:22px;background:var(--faint)}
.tl-per{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;font-weight:600;color:var(--faint);text-align:center}
.gm{position:absolute;width:0;top:0;height:92px}
.gm::before{content:"";position:absolute;left:0;width:1px;background:var(--faint)}
.gm.up::before{top:30px;height:16px}
.gm.dn::before{top:48px;height:16px}
.tm{position:absolute;left:-15px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.3px}
.gm.up .tm{top:0} .gm.dn .tm{top:62px}
.tm.UTA{background:#0B0B0B;color:#6CACE4;box-shadow:inset 0 0 0 2px #6CACE4}
.tm.SEA{background:#99D9D9;color:#001628}
.tm.cash{outline:3px solid var(--green);outline-offset:2px}
.scale2{position:relative;height:16px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.scale2 span{position:absolute;top:0;white-space:nowrap}
.scale2 .z{left:0}
.scale2 .e{right:0}
.scale2 .t{color:var(--fg);font-weight:700}
.scale .mk{color:var(--fg);font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps span{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted);font-variant-numeric:tabular-nums}
.steps span.k{background:var(--green);color:var(--green-ink)}
.note{margin:0;font-size:12px;color:var(--faint)}
.t-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.asof{margin:0;font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .row.fresh .ico.hit svg,.row.flash .ico.hit svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .row.fresh.hit,.row.flash.hit{animation:glow 1.2s ease-out both}
  .ico.live{animation:pulse 1.6s ease-in-out infinite}
}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes glow{from{background:var(--green-tint-2)}to{background:var(--green-tint)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(245,192,46,.18)}}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <h1>Week 7 Parlay</h1>
  </div>

  <section style="display:flex;flex-direction:column;gap:8px" aria-label="Games">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><p class="label">Games on this ticket</p><span id="updated" style="font-size:12px;color:var(--faint)"></span></div>
    <nav class="rail" id="rail"></nav>
  </section>

  <article class="ticket" id="ticket"><div class="t-head"><p class="t-sum">Loading ticket…</p></div></article>
</div>

<script>
let GAMES = {}, TICKET = null, AS_OF = null;
const mode = 'compact'; const open = new Set(); let firstPaint = true, flashId = null;

const fo = o => (o > 0 ? '+' : '') + o;
const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const tz = { timeZone:'America/New_York' };
const dayOf = iso => new Date(iso).toLocaleDateString('en-US', { weekday:'short', ...tz });
const timeOf = iso => new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', ...tz });
const isToday = iso => new Date(iso).toLocaleDateString('en-US', tz) === new Date().toLocaleDateString('en-US', tz);
const started = g => g.state ? g.state === 'in' : (!g.final && new Date(g.start) <= new Date());
const when = g => (isToday(g.start) ? 'Today' : dayOf(g.start)) + (g.showTime ? ' ' + timeOf(g.start) : '');
const sum = a => a.reduce((x, y) => x + y, 0);
const st = (l, g) => l.result || (started(g) ? 'live' : 'open');
const lineOf = l => l.over ? 'O ' + l.target : l.target + '+';
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const XMARK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const icon = s => `<span class="ico ${s}" aria-label="${s === 'hit' ? 'Won' : s === 'miss' ? 'Lost' : s === 'live' ? 'Live' : 'Open'}">${s === 'hit' ? CHECK : s === 'miss' ? XMARK : ''}</span>`;

function scoreText(l, g) {
  if (!g.final) return '';
  const a = sum(g.a), h = sum(g.h);
  return l.side === 'home' ? `${g.home} ${h}–${a}` : `${g.away} ${a}–${h}`;
}
function rightCol(l, g, odds) {
  let v = '';
  if (l.kind === 'count') v = `<span class="v">${l.actual}<span style="font-size:13px;color:var(--faint);font-family:var(--body);font-weight:500"> / ${lineOf(l)}</span></span>`;
  else if (g.final) v = `<span class="v">${scoreText(l, g)}</span>`;
  return `<span class="right">${odds != null ? `<span class="o">${l.est ? '<small class="est">est.</small> ' : ''}${fo(odds)}</span>` : ''}${v}</span>`;
}
function mini(l, g) {
  if (l.kind !== 'count') return '';
  const max = Math.max(l.target, l.actual);
  return `<span class="mini" aria-hidden="true"><i style="width:${Math.min(100, l.actual / max * 100)}%"></i><b style="left:${l.target / max * 100}%"></b></span>`;
}
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const inningText = L => ({ top:'Top ', bottom:'Bot ', mid:'Mid ', end:'End ' }[L.half] || '') + ord(L.inning);
function liveBug(g) {
  const L = g.live, on = i => L.bases[i] ? '#F5C02E' : 'none', ring = i => L.bases[i] ? '#F5C02E' : '#6E6E6E';
  // diamond: 1st right, 2nd top, 3rd left
  const base = (x, y, i) => `<rect x="${x - 8}" y="${y - 8}" width="16" height="16" transform="rotate(45 ${x} ${y})" fill="${on(i)}" stroke="${ring(i)}" stroke-width="2"/>`;
  const outs = [0, 1, 2].map(i => `<i class="${i < L.outs ? 'on' : ''}"></i>`).join('');
  const arrow = L.half === 'top' ? '▲' : L.half === 'bottom' ? '▼' : '';
  const sa = sum(L.a), sh = sum(L.h);
  const cols = Math.max(L.a.length, 9);
  const cell = (arr, i) => i < arr.length ? arr[i] : '';
  const r = (n, arr, tot) => `<tr><td>${n}</td>${Array.from({ length:cols }, (_, i) => `<td>${cell(arr, i)}</td>`).join('')}<td class="tot">${tot}</td></tr>`;
  return `<div class="bug">
      <div class="bug-score"><div><span>${g.away}</span><b>${sa}</b></div><div><span>${g.home}</span><b>${sh}</b></div></div>
      <div class="bug-state"><span class="inn">${arrow} ${inningText(L)}</span><span class="outs" aria-label="${L.outs} out">${outs}<em>${L.outs} out</em></span></div>
      <svg class="diamond" viewBox="0 0 80 64" role="img" aria-label="Runners on ${['first','second','third'].filter((_, i) => L.bases[i]).join(' and ') || 'no bases'}">${base(58, 36, 0)}${base(40, 18, 1)}${base(22, 36, 2)}</svg>
    </div>
    ${L.batter ? `<p class="stat">At bat: ${L.batter} · Pitching: ${L.pitcher}</p>` : ''}
    <div class="board"><table><thead><tr><th>${ord(L.inning)} inning</th>${Array.from({ length:cols }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>R</th></tr></thead><tbody>${r(g.away, L.a, sa)}${r(g.home, L.h, sh)}</tbody></table></div>
    ${L.sample ? '<p class="note"><b class="smp">SAMPLE</b> Live game state is placeholder data until scores are connected.</p>' : ''}`;
}
function pasList(l) {
  if (!l.pas) return '';
  return `<div class="pas">${l.pas.map(p => `<div><span>${p[0]}</span><b>${p[1]}</b><em>${p[2]} TB</em></div>`).join('')}</div>`;
}
function board(g) {
  if (g.live && started(g)) return liveBug(g);
  if (!g.final && !(started(g) && g.a && g.per)) {
    const t = started(g) ? 'Live' : when(g) + (g.tag ? ' · ' + g.tag : '');
    return `<div class="board"><div class="pre-strip"><span>${g.away}</span><span>${t}</span><span>${g.home}</span></div></div>`;
  }
  const r = (n, arr) => `<tr><td>${n}</td>${arr.map(x => `<td>${x}</td>`).join('')}<td class="tot">${sum(arr)}</td></tr>`;
  return `<div class="board"><table><thead><tr><th>${g.final ? 'Final · ' + dayOf(g.start) : (g.detail || 'Live')}</th>${g.per.map(p => `<th>${p}</th>`).join('')}<th>T</th></tr></thead><tbody>${r(g.an, g.a)}${r(g.hn, g.h)}</tbody></table></div>`;
}
function bigTrack(l, g) {
  if (l.kind !== 'count') return '';
  const s = st(l, g);
  // The bar ends at the line, or at the final number once it's past the line.
  const max = Math.max(l.target, l.actual);
  const p = v => Math.min(100, v / max * 100);
  const tp = p(l.target);
  const dots = (l.steps || []).filter(x => x.v < l.actual).map(x => `<span class="st" style="left:${p(x.v)}%"></span>`).join('');
  const steps = '';
  const tLabel = tp >= 95 ? `<span class="t" style="right:0">${l.target}</span>` : `<span class="t" style="left:${tp}%;transform:translateX(-50%)">${l.target}</span>`;
  const end = l.actual > l.target ? `<span class="e">${l.actual}</span>` : '';
  return `<div class="big">
    <div class="trk" role="img" aria-label="${l.actual} ${l.unit}, line ${l.target}"><span class="ln"></span><span class="fl ${s}" style="width:${p(l.actual)}%"></span>${dots}<span class="tg" style="left:${tp}%"></span><span class="dt ${s}" style="left:${p(l.actual)}%"></span></div>
    <div class="scale2"><span class="z">0</span>${tLabel}${end}</div>${steps}</div>`;
}
function playerBox(l) {
  if (!l.box) return '';
  return `<div class="board"><table><thead><tr><th>${l.sel}</th><th>No.</th><th>Yds</th><th>Avg</th><th>TD</th></tr></thead><tbody>${l.box.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="tot">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div>`;
}
function tdDiagram(l) {
  if (!l.td) return '';
  // Red-zone view: last 20 yards plus the end zone. 12 px per yard.
  const Y = 12, goal = 260, start = goal - l.td.yds * Y;
  const lines = [0, 5, 10, 15].map(y => `<line x1="${goal - y * Y - 0}" y1="14" x2="${goal - y * Y}" y2="96" stroke="#FFFFFF" stroke-opacity="${y % 10 ? .25 : .55}" stroke-width="${y ? 1 : 2}"/>`).join('')
    + `<line x1="${goal - 20 * Y}" y1="14" x2="${goal - 20 * Y}" y2="96" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1"/>`;
  return `<div class="field"><svg viewBox="0 0 330 110" role="img" aria-label="${l.td.yds}-yard touchdown run in ${l.td.q}">
    <rect x="0" y="14" width="${goal}" height="82" fill="#1F5A2A"/>
    <rect x="${goal}" y="14" width="70" height="82" fill="${l.td.team && l.td.team !== 'CHI' ? '#1F2A44' : '#0B162A'}"/>
    <text x="${goal + 35}" y="60" fill="#C83803" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="2">${l.td.team || 'CHI'}</text>
    ${lines}
    <text x="${goal - 10 * Y}" y="108" fill="#A8A8A8" font-family="Barlow, sans-serif" font-size="10" text-anchor="middle">10</text>
    <text x="${goal - 20 * Y + 4}" y="108" fill="#A8A8A8" font-family="Barlow, sans-serif" font-size="10" text-anchor="start">20</text>
    <text x="${goal}" y="108" fill="#A8A8A8" font-family="Barlow, sans-serif" font-size="10" text-anchor="middle">G</text>
    <line x1="${start}" y1="55" x2="${goal + 26}" y2="55" stroke="#53D337" stroke-width="3" stroke-linecap="round"/>
    <path d="M${goal + 26} 48 L${goal + 36} 55 L${goal + 26} 62 Z" fill="#53D337"/>
    <circle cx="${start}" cy="55" r="6" fill="#FFFFFF"/>
    <text x="${start}" y="9" fill="#FFFFFF" font-family="Barlow, sans-serif" font-weight="700" font-size="11" text-anchor="middle">${l.td.yds}-yd ${l.td.how || 'TD run'}</text>
    <line x1="${start}" y1="12" x2="${start}" y2="46" stroke="#FFFFFF" stroke-opacity=".5" stroke-dasharray="2 3"/>
  </svg><p class="stat">${l.td.q} · ${l.td.clock}</p></div>`;
}
function goalTimeline(l) {
  if (!l.goals) return '';
  const cashAt = Math.ceil(l.target) - 1;
  const marks = l.goals.map(([t, m], i) => {
    const up = t === 'UTA';
    return `<span class="gm ${up ? 'up' : 'dn'}" style="left:clamp(15px, ${m / 60 * 100}%, calc(100% - 15px))"><i class="tm ${t}${i === cashAt ? ' cash' : ''}">${t}</i></span>`;
  }).join('');
  return `<div class="tl" role="img" aria-label="Goals by game time: ${l.goals.map(g => g[0]).join(', ')}">
    <div class="tl-ax"></div><div class="tl-div" style="left:33.333%"></div><div class="tl-div" style="left:66.666%"></div>${marks}
    <div class="tl-per"><span>P1</span><span>P2</span><span>P3</span></div></div>`;
}
function receivers(l) {
  if (!l.receivers) return '';
  return `<div class="board"><table><thead><tr><th>Receiving</th><th>Rec</th><th>Yds</th><th>TD</th></tr></thead><tbody>${l.receivers.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="tot">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
}
function passLine(l) {
  if (!l.passing) return '';
  return `<div class="pline">${l.passing.map(p => `<div><b>${p[1]}</b><small>${p[0]}</small></div>`).join('')}</div>`;
}
function legRow(l, g, odds, who, inGroup) {
  const s = st(l, g), isOpen = mode === 'expanded' || open.has(l.id);
  const liveTxt = g.live ? 'Live · ' + inningText(g.live) : 'Live' + (g.detail ? ' · ' + g.detail : '');
  const gameLine = inGroup ? (l.who ? `<span class="meta"><em class="who">${l.who}</em></span>` : '') : `<span class="meta">${who ? `<em class="who">${who}</em>` : ''}${g.short} · ${g.final ? 'Final' : started(g) ? liveTxt : when(g)}</span>`;
  const extra = l.receivers ? receivers(l) : l.noBoard ? '' : board(g);
  const detail = isOpen ? `<div class="detail">${bigTrack(l, g)}${l.stat ? `<p class="stat">${l.stat}</p>` : ''}${passLine(l)}${tdDiagram(l)}${playerBox(l)}${goalTimeline(l)}${pasList(l)}${extra}</div>` : '';
  const anim = (firstPaint ? ' fresh' : '') + (flashId === l.id ? ' flash' : '');
  return `<button type="button" class="row ${s}${anim}" data-id="${l.id}" aria-expanded="${isOpen}">
    <span class="row-main">${icon(s)}<span class="sel"><b>${l.sel}</b><span>${l.mkt}</span>${gameLine}</span>${rightCol(l, g, odds)}${isOpen ? '' : mini(l, g)}</span>${detail}</button>`;
}

function render() {
  if (!TICKET) return;
  const all = TICKET.items.flatMap(it => it.legs ? it.legs.map(l => ({ l, g:GAMES[it.game] })) : [{ l:it, g:GAMES[it.game] }]);
  const hits = all.filter(x => x.l.result === 'hit').length, misses = all.filter(x => x.l.result === 'miss').length;
  const state = misses ? 'lost' : hits === all.length ? 'won' : 'open';
  const items = TICKET.items.slice().sort((a, b) => new Date(GAMES[a.game].start) - new Date(GAMES[b.game].start));

  // rail: one chip per game, in start order
  const seen = []; items.forEach(it => { if (!seen.includes(it.game)) seen.push(it.game); });
  const nextG = seen.find(k => !GAMES[k].final && !started(GAMES[k]));
  document.getElementById('rail').innerHTML = seen.map(k => {
    const g = GAMES[k], it = items.find(i => i.game === k);
    const res = it.legs ? (it.legs.every(l => l.result === 'hit') ? 'hit' : '') : (it.result || '');
    const isLive = started(g);
    const t = res === 'hit' ? '✓ Hit · ' + (g.final ? 'Final' : 'Live') : g.final ? 'Final' : isLive ? (g.live ? 'Live · ' + inningText(g.live) : 'Live' + (g.detail ? ' · ' + g.detail : '')) : when(g);
    return `<a class="chip ${res}${isLive ? ' live' : ''}" href="#leg-${k}"><span class="g">${g.name}</span><span class="t">${t}</span></a>`;
  }).join('').replace(/^/, '<div class="rail-in">') + '</div>';

  const pips = all.slice().sort((a, b) => new Date(a.g.start) - new Date(b.g.start)).map(x => `<i class="${st(x.l, x.g)}"></i>`).join('');
  const legsHTML = items.map(it => {
    const g = GAMES[it.game];
    if (it.legs) {
      const gs = it.legs.every(l => l.result === 'hit') ? 'hit' : '';
      return `<div class="grp" id="leg-${it.game}"><div class="grp-head ${gs}"><b>${it.group}</b><span class="sep"></span><span>${fo(it.odds)}</span><span style="margin-left:auto;font-size:12px;color:var(--faint);font-weight:500">${g.short} · Final</span></div>
        ${it.legs.map(l => legRow(l, g, l.odds, null, true)).join('')}</div>`;
    }
    return `<div id="leg-${it.game}">${legRow(it, g, it.odds, it.who, false)}</div>`;
  }).join('');

  const tk = document.getElementById('ticket');
  tk.className = 'ticket ' + state;
  tk.innerHTML = `<div class="t-head">
      <div class="t-title"><h2>${TICKET.title}</h2><span class="sep"></span><span class="odds">${fo(TICKET.odds)}</span><span class="pill ${state}">${state === 'won' ? 'Won' : state === 'lost' ? 'Lost' : 'Open'}</span></div>
      <div class="t-money"><div><small>Wager</small><b>${money(TICKET.wager)}</b></div><div><small>To pay</small><b style="color:var(--green)">${money(TICKET.toPay)}</b></div><div><small>Each (÷${TICKET.split})</small><b>${money(TICKET.toPay / TICKET.split)}</b></div></div>
      <div class="prog"><div class="prog-top"><span>${hits} of ${all.length} won</span><span>${all.length - hits - misses} open</span></div><div class="pips">${pips}</div></div>
    </div>
    <div class="legs">${legsHTML}</div>
    <div class="t-foot"><span>${TICKET.placed}</span><span>Funded by Noah</span></div>`;

  firstPaint = false; flashId = null;
}

document.getElementById('ticket').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r || mode === 'expanded') return;
  const id = r.dataset.id; open.has(id) ? open.delete(id) : open.add(id); flashId = id; render();
});
async function load() {
  let next = 60000;
  try {
    const r = await fetch('/api/parlay/' + SLUG, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    GAMES = d.games; TICKET = d.ticket; AS_OF = d.asOf;
    render();
    const upd = document.getElementById('updated');
    if (upd) upd.textContent = 'Updated ' + new Date(AS_OF).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', second:'2-digit', timeZone:'America/New_York' });
    if (Object.values(GAMES).some(g => g.state === 'in')) next = 20000;
  } catch (e) {
    const upd = document.getElementById('updated');
    if (upd) upd.textContent = 'Couldn\u2019t refresh. Retrying\u2026';
    next = 15000;
  }
  setTimeout(load, next);
}
const SLUG = new URLSearchParams(location.search).get('week') || 'week7';
load();
setInterval(render, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
