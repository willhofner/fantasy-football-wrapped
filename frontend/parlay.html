<style>

html{background:#0B0B0B;overflow-anchor:none}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: a "My Bets" screen. Up-next game rail, then the ticket: header, legs as rows (tap to expand), footer. Settled rows tint by result. */
:root{
  --bg:#0B0B0B; --card:#1C1C1C; --card-2:#262626; --line:#2E2E2E; --fg:#FFFFFF; --muted:#A8A8A8; --faint:#6E6E6E;
  --green:#53D337; --green-ink:#0A1A05; --green-tint:#172814; --green-tint-2:#1F3A19; --green-line:#2F5A26;
  --red:#FF5147; --red-tint:#2A1513; --red-line:#5A2420;
  --open:#F5C02E; --open-tint:#3A300E; --gold:#F5C02E; --live-tint:#2A2510; --live-line:#6B5A1C;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:Barlow,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.3}
button{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--body);font-weight:700;font-size:24px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.label{font-size:12px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin:0}

/* up-next rail */
.rail{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;width:max-content}
.chip{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:10px;background:var(--card);text-decoration:none;color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip .g{font-weight:700;font-size:14px}
.chip .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.hit{background:var(--green-tint);border-color:var(--green-line)}
.chip.hit .t{color:var(--green)}
.chip.live{background:var(--live-tint);border-color:var(--live-line)}
.chip.live .t{color:var(--open)}
.row.live{background:var(--live-tint)}
.row.live .who{background:rgba(245,192,46,.18);color:var(--open)}
.row.live .board{background:rgba(0,0,0,.28)}
.bug{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;background:rgba(0,0,0,.32);border-radius:10px;padding:10px 12px}
.bug-score{display:flex;flex-direction:column;gap:4px}
.bug-score div{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.bug-score b{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.bug-state{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.inn{font-weight:800;font-size:14px;color:var(--open);white-space:nowrap}
.outs{display:flex;align-items:center;gap:4px}
.outs i{width:9px;height:9px;border-radius:50%;border:2px solid var(--faint)}
.outs i.on{background:var(--open);border-color:var(--open)}
.outs em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.diamond{width:80px;height:64px;display:block}
.pas{display:flex;flex-direction:column;gap:6px}
.pas div{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;font-size:13px;align-items:baseline}
.pas span{color:var(--muted);font-weight:600}
.pas em{font-style:normal;color:var(--open);font-weight:700}
.smp{font-size:10px;letter-spacing:.6px;background:var(--open);color:#1A1400;padding:1px 5px;border-radius:3px;margin-right:4px}

/* ticket */
.ticket{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ticket.won{background:var(--green-tint);border-color:var(--green)}
.ticket.lost{background:var(--red-tint);border-color:var(--red-line)}
.t-head{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.t-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t-title h2{margin:0;font-size:20px;font-weight:700}
.t-title .sep{width:1px;height:16px;background:var(--faint)}
.t-title .odds{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{margin-left:auto;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
.pill.open{background:var(--open-tint);color:var(--open)}
.pill.won{background:var(--green);color:var(--green-ink)}
.pill.lost{background:var(--red);color:#1A0504}
.t-sum{font-size:13px;color:var(--muted);margin:0}
.t-money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.t-money div{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-money small{font-size:12px;font-weight:600;color:var(--muted)}
.t-money b{color:var(--fg);font-weight:700;font-size:19px}
.stat{margin:0;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.prog-top span:last-child{color:var(--muted);font-weight:500}
.pips{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.pips i{height:5px;border-radius:3px;background:var(--card-2)}
.pips i.hit{background:var(--green)} .pips i.miss{background:var(--red)} .pips i.live{background:var(--open)}

/* legs */
.legs{display:flex;flex-direction:column}
.row{display:block;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);padding:0;cursor:pointer}
.row.hit{background:var(--green-tint)}
.row.miss{background:var(--red-tint)}
.row-main{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px}
.ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ico.open{border:2px solid var(--open);border-radius:50%;width:22px;height:22px;margin:4px 3px}
.ico.hit{background:var(--green-tint-2)}
.ico.hit svg{stroke:var(--green)}
.ico.miss{background:var(--red-tint)}
.ico.miss svg{stroke:var(--red)}
.ico.live{border:2px solid var(--open);border-radius:50%;width:22px;height:22px;margin:4px 3px;background:var(--open-tint)}
.sel{display:flex;flex-direction:column;gap:2px;min-width:0}
.sel b{font-size:16px;font-weight:700}
.sel span{font-size:13px;color:var(--muted)}
.sel .meta{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.who{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:4px;background:var(--card-2);color:var(--muted);margin-right:6px;vertical-align:1px}
.row.hit .who{background:var(--green-tint-2);color:var(--green)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.right .o{font-size:15px;font-weight:600;color:var(--muted)}
.row.hit .right .o{color:var(--green)}
.right .v{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.mini{grid-column:2 / 4;height:4px;border-radius:2px;background:var(--card-2);position:relative;margin-top:-2px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--faint)}
.mini b{position:absolute;top:-3px;width:2px;height:10px;background:var(--fg)}
.row.hit .mini{background:var(--green-tint-2)} .row.hit .mini i{background:var(--green)}
.row.miss .mini i{background:var(--red)}
.row.live .mini i{background:var(--open)}

/* group (SGP) */
.grp-head{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;border-top:1px solid var(--line)}
.grp-head b{font-size:16px}
.grp-head .sep{width:1px;height:14px;background:var(--faint)}
.grp-head span{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-head.hit{background:var(--green-tint)}
.grp-head.hit span{color:var(--green)}
.grp .row{border-top:none}

/* expanded details */
.detail{padding:0 16px 14px 56px;display:flex;flex-direction:column;gap:12px}
.board{background:var(--card-2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.row.hit .board,.grp-detail.hit .board{background:rgba(0,0,0,.28)}
.board table{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-size:12px;font-weight:500;color:var(--muted);text-align:center;padding:0 0 6px;width:30px}
.board th:first-child{text-align:left;width:auto}
.board td{text-align:center;padding:4px 0;font-family:var(--display);font-size:17px;font-weight:600}
.board td:first-child{text-align:left;font-family:var(--body);font-size:15px;font-weight:600}
.board td.tot{color:var(--gold);font-weight:800}
.pre-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.pre-strip span:nth-child(2){font-weight:500;color:var(--muted);font-size:14px}
.big{display:flex;flex-direction:column;gap:6px}
.big-top{display:flex;justify-content:space-between;align-items:baseline}
.big-top b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big-top b small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.big-top span{font-size:13px;font-weight:800;letter-spacing:.6px}
.trk{position:relative;height:26px}
.trk .ln{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--card-2)}
.row.hit .trk .ln{background:rgba(0,0,0,.35)}
.trk .fl{position:absolute;left:0;top:11px;height:4px;border-radius:2px;background:var(--faint)}
.trk .fl.hit{background:var(--green)} .trk .fl.miss{background:var(--red)} .trk .fl.live{background:var(--open)}
.trk .st{position:absolute;top:9px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:2px solid var(--muted);transform:translateX(-4px)}
.trk .tg{position:absolute;top:2px;width:2px;height:22px;background:var(--fg);transform:translateX(-1px)}
.trk .dt{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;transform:translateX(-8px);border:3px solid var(--card);background:var(--faint)}
.row.hit .trk .dt{border-color:var(--green-tint)}
.trk .dt.hit{background:var(--green)} .trk .dt.miss{background:var(--red)} .trk .dt.live{background:var(--open)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.est{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--faint);text-transform:uppercase}
.pline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.pline div{background:rgba(0,0,0,.28);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pline b{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.pline small{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
.rx{display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:12px}
.rx-h{margin:0;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.rx-row{display:flex;flex-direction:column;gap:5px}
.rx-top{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.rx-top b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx-top span{font-size:12px;color:var(--muted)}
.rx-top em{font-style:normal;color:var(--green);font-weight:700}
.rx-top strong{font-family:var(--display);font-size:20px;font-weight:700;text-align:right;line-height:1}
.rx-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06)}
.rx-bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.field{display:flex;flex-direction:column;gap:6px}
.field svg{width:100%;max-width:100%;height:auto;display:block;border-radius:8px}
.tl{position:relative;height:104px;margin:4px 0 0}
.tl-ax{position:absolute;left:0;right:0;top:46px;height:2px;background:var(--faint)}
.tl-div{position:absolute;top:36px;width:1px;height:22px;background:var(--faint)}
.tl-per{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;font-weight:600;color:var(--faint);text-align:center}
.gm{position:absolute;width:0;top:0;height:92px}
.gm::before{content:"";position:absolute;left:0;width:1px;background:var(--faint)}
.gm.up::before{top:30px;height:16px}
.gm.dn::before{top:48px;height:16px}
.tm{position:absolute;left:-15px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.3px}
.gm.up .tm{top:0} .gm.dn .tm{top:62px}
.tm.UTA{background:#0B0B0B;color:#6CACE4;box-shadow:inset 0 0 0 2px #6CACE4}
.tm.SEA{background:#99D9D9;color:#001628}
.tm.cash{outline:3px solid var(--green);outline-offset:2px}
.scale2{position:relative;height:16px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.scale2 span{position:absolute;top:0;white-space:nowrap}
.scale2 .z{left:0}
.scale2 .e{right:0}
.scale2 .t{color:var(--fg);font-weight:700}
.scale .mk{color:var(--fg);font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps span{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted);font-variant-numeric:tabular-nums}
.steps span.k{background:var(--green);color:var(--green-ink)}
.note{margin:0;font-size:12px;color:var(--faint)}
.t-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.asof{margin:0;font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .row.fresh .ico.hit svg,.row.flash .ico.hit svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .row.fresh.hit,.row.flash.hit{animation:glow 1.2s ease-out both}
  .ico.live{animation:pulse 1.6s ease-in-out infinite}
}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){
  .enter .pips i{animation:pipin .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 80ms);transform-origin:left}
  .enter .sc-bar i,.enter .mgr-bar i,.enter .inbars .bar i,.enter .mini i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
  .opening{animation:reveal .28s cubic-bezier(.2,.8,.2,1) both}
  .tick{animation:tick 1.1s ease-out}
  .row.settled.miss{animation:settlemiss .9s ease-out both}
  .row.settled .ico svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
}
@media (prefers-reduced-motion:no-preference){
  .hist.reveal li .ico{animation:rv-box .95s cubic-bezier(.55,0,.25,1) both;animation-delay:calc(var(--i,0) * 90ms)}
  .hist.reveal li .ico path{stroke-dasharray:1;stroke-dashoffset:1;animation:rv-draw .28s ease-out both;animation-delay:calc(var(--i,0) * 90ms + 110ms)}
  .hist.reveal li .h-r{animation:rv-right .95s linear both;animation-delay:calc(var(--i,0) * 90ms)}
  .hist.reveal li .h-s{animation:rv-left .95s linear both;animation-delay:calc(var(--i,0) * 90ms)}
}
@keyframes rv-box{0%{transform:translateX(var(--dx)) scale(.3);opacity:0}10%{transform:translateX(var(--dx)) scale(.85);opacity:1}42%{transform:translateX(var(--dx)) scale(.85);animation-timing-function:cubic-bezier(.55,0,.25,1)}100%{transform:scale(.85)}}
@keyframes rv-draw{to{stroke-dashoffset:0}}
@keyframes rt-box{0%{transform:translateX(var(--dx)) scale(.3);opacity:0}10%{transform:translateX(var(--dx));opacity:1}42%{transform:translateX(var(--dx));animation-timing-function:cubic-bezier(.55,0,.25,1)}100%{transform:none}}
@keyframes rv-right{0%,42%{clip-path:inset(0 0 0 100%)}60%,100%{clip-path:inset(0 0 0 0)}}
@keyframes rv-left{0%,52%{clip-path:inset(0 0 0 100%)}100%{clip-path:inset(0 0 0 0)}}
@keyframes pipin{from{transform:scaleX(0);opacity:.2}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}}
@keyframes tick{0%{color:var(--green);text-shadow:0 0 14px rgba(83,211,55,.7)}100%{text-shadow:none}}
@keyframes settlemiss{0%{background:rgba(255,81,71,.35)}15%{transform:translateX(-4px)}30%{transform:translateX(4px)}45%{transform:translateX(-2px)}60%{transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear both}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@keyframes glow{from{background:var(--green-tint-2)}to{background:var(--green-tint)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(245,192,46,.18)}}

/* ---- the ticket is alive: a faint breathing glow (opacity only, on a pseudo-element, so it never repaints the rows) ---- */
.ticket{position:relative}
.ticket::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 1px var(--aura,transparent),inset 0 0 26px var(--aura,transparent);opacity:.35}
.ticket.won::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:inherit;background:linear-gradient(105deg,transparent 42%,rgba(255,236,170,.13) 50%,transparent 58%) no-repeat;background-size:260% 100%;background-position:160% 0}
.pips i{position:relative}
@media (prefers-reduced-motion:no-preference){
  .ticket::after{animation:breathe var(--bt,5s) ease-in-out infinite}
  .ticket.sweat{animation:sweat 1.3s ease-in-out infinite}
  .ticket.won::before{animation:sheen 4s ease-in-out 1s infinite}
  /* live legs: the progress bar shimmers; a leg that's nearly there gets a heartbeat */
  .row.live .mini i,.row.live .trk .fl{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);background-size:45% 100%;background-repeat:no-repeat;animation:shim 1.8s linear infinite}
  .row.close .mini i,.row.close .trk .fl{animation-duration:.9s}
  .row.close .ico.live{animation:heartbeat 1s ease-in-out infinite}
  .row.close{animation:closeglow 1.6s ease-in-out infinite}
  /* opening a ticket: legs print in like a receipt, misses get struck through with a pen, a missed pip cracks */
  .enter .legs > div{animation:print .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
  .enter .ticket.won .legs > div,.enter .ticket.lost .legs > div{animation:none}

}

.h-r{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.h-w{font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap}
.h-o{font-size:13px;font-weight:700;color:var(--muted)}
.hist li.hit .h-o{color:var(--green)}
.hist li.miss .h-o{color:var(--red)}
.inbars{list-style:none;margin:0;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.inbars.card{background:var(--card);border-radius:14px;border:1px solid var(--line)}
.inbars li{display:grid;grid-template-columns:60px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.inbars li span:first-child{font-weight:600}
.inbars .bar{height:12px;border-radius:6px;background:var(--card-2);overflow:hidden}
.inbars .bar i{display:block;height:100%;border-radius:6px;background:var(--open)}
.inbars b{text-align:right}
.funders{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.funders li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:baseline;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.funders li:first-child{border-top:none}
.funders span{color:var(--muted);font-weight:600}
.funders em{font-style:normal;font-size:12px;font-weight:700;min-width:96px;text-align:right}
.funders em.g{color:var(--green)} .funders em.r{color:var(--red)}
@media (max-width:380px){.mgr-chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lead{margin:-4px 0 0;font-size:12px;color:var(--faint)}
.prof{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.prof svg{width:100%;height:auto;display:block}
.prof .ax{stroke:var(--line);stroke-width:1}
.prof .q{fill:var(--faint);font-size:9px;font-weight:700;letter-spacing:.8px}
.prof text:not(.q){fill:var(--fg);font-size:11px;font-weight:600}
.prof .pd{fill:var(--muted);stroke:var(--card);stroke-width:2}
.prof .pd.g{fill:var(--green)} .prof .pd.r{fill:var(--red)}
.prof-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prof-list li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 4px;border-top:1px solid var(--line);font-size:13px}
.prof-list li:first-child{border-top:none}
.prof-list span{color:var(--muted);font-weight:600}
.prof-list em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.prof-list em.g{color:var(--green)} .prof-list em.r{color:var(--red)}

.tab.tab-pick span{font-size:18px;line-height:1}
.picks-frame{display:block;color-scheme:dark;opacity:0;transition:opacity .18s}
.picks-frame.ready{opacity:1}
.tab.tab-bookie,.tab.tab-lm{color:#F5D67A;border:1px solid rgba(245,192,46,.4)}
.tab.tab-bookie::before,.tab.tab-lm::before{background:rgba(245,192,46,.14)}
.tab.tab-bookie[aria-current="page"],.tab.tab-lm[aria-current="page"]{color:#1A1400;border-color:#F5C02E}
.tab.tab-bookie[aria-current="page"]::before,.tab.tab-lm[aria-current="page"]::before{background:#F5C02E}
.tabs.glide .tab.tab-bookie[aria-current="page"],.tabs.glide .tab.tab-lm[aria-current="page"]{color:#F5D67A}
html.picks-locked.on-picks body::after{content:'';position:fixed;inset:0;border:4px solid var(--red);pointer-events:none;z-index:60;box-shadow:inset 0 0 24px rgba(255,81,71,.35)}
.jail-label{margin-top:30px;color:var(--open)!important}
.ticket.jail{border:1px dashed rgba(245,192,46,.55);background:repeating-linear-gradient(90deg,rgba(245,192,46,.04) 0 10px,transparent 10px 20px),var(--card)}
.picks-frame{width:calc(100% + 32px);margin:-6px -16px -48px;border:0;background:var(--bg)}
#view[hidden],.picks-frame[hidden]{display:none!important}
.pickhint{margin:-8px 0 0;font-size:13px;color:var(--green);font-weight:600}
.pickhint span{display:inline-block;margin-right:2px}
@media (prefers-reduced-motion:no-preference){
  .tab.tab-pick.new{animation:pickpulse 1.8s ease-out infinite}
  .pickhint span{animation:hintbob 1.2s ease-in-out infinite}
}
@keyframes pickpulse{0%{box-shadow:0 0 0 0 rgba(83,211,55,.55)}70%{box-shadow:0 0 0 9px rgba(83,211,55,0)}100%{box-shadow:0 0 0 0 rgba(83,211,55,0)}}
@keyframes hintbob{50%{transform:translateY(-3px)}}
</style>

<body>
<div class="wrap">
  <div class="brand"><h1>pandolfi.bet</h1><span id="updated"></span></div>
  <nav class="tabs" id="tabs" aria-label="Weeks"></nav>
  <p class="pickhint" id="pickhint" hidden><span aria-hidden="true">↑</span> Tap <b id="hintwk">Make Wk 8 picks</b> to choose your leg</p>
  <main id="view"></main>
  <iframe id="picksframe" class="picks-frame" title="Pick sheet" hidden onload="this.classList.add('ready'); if (!this.hidden) this.contentWindow.postMessage({ pbShown: true }, location.origin)"></iframe>
  <iframe id="bookieframe" class="picks-frame" title="Bookie tools" hidden onload="this.classList.add('ready')"></iframe>
  <iframe id="lmframe" class="picks-frame" title="LM tools" hidden onload="this.classList.add('ready')"></iframe>
</div>
<script src="/static/parlay/history.js"></script>
<script src="/static/motion.js?v=1"></script>
<script src="/static/parlay/play.js?v=2"></script>
<script>
const fo = o => (o > 0 ? '+' : '') + o;
const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n < 0 ? '−$' : n > 0 ? '+$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tz = { timeZone: 'America/New_York' };
const dayOf = iso => new Date(iso).toLocaleDateString('en-US', { weekday: 'short', ...tz });
const timeOf = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', ...tz });
const isToday = iso => new Date(iso).toLocaleDateString('en-US', tz) === new Date().toLocaleDateString('en-US', tz);
const started = g => g.state ? g.state === 'in' : (!g.final && new Date(g.start) <= new Date());
const when = g => (isToday(g.start) ? 'Today' : dayOf(g.start)) + (g.showTime ? ' ' + timeOf(g.start) : '');
const sum = a => a.reduce((x, y) => x + y, 0);
const st = (l, g) => l.result || (started(g) ? 'live' : 'open');
const lineOf = l => l.over === false ? 'U ' + l.target : l.over ? String(l.target) : l.target + '+';
const margin = (l, g) => l.side === 'home' ? sum(g.h) - sum(g.a) : sum(g.a) - sum(g.h);
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const XMARK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path pathLength="1" d="M6 6l12 12M18 6L6 18"/></svg>';
const DASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path pathLength="1" d="M6 12h12"/></svg>';
const LABEL = { hit: 'Won', miss: 'Lost', void: 'Void', live: 'Live', open: 'Open' };
const icon = s => `<span class="ico ${s}" aria-label="${LABEL[s]}">${s === 'hit' ? CHECK : s === 'miss' ? XMARK : s === 'void' ? DASH : ''}</span>`;
const TEAMC = { CHI: ['#0B162A', '#C83803'], DET: ['#0076B6', '#FFFFFF'], BUF: ['#00338D', '#FFFFFF'], GB: ['#203731', '#FFB612'], SEA: ['#002244', '#69BE28'], BAL: ['#241773', '#FFFFFF'], CIN: ['#FB4F14', '#000000'], IND: ['#002C5F', '#FFFFFF'], NE: ['#002244', '#FFFFFF'], LV: ['#000000', '#A5ACAF'], CAR: ['#0085CA', '#000000'], NYG: ['#0B2265', '#FFFFFF'], TEN: ['#0C2340', '#4B92DB'], DAL: ['#041E42', '#FFFFFF'], NYJ: ['#125740', '#FFFFFF'], MIA: ['#008E97', '#FC4C02'], JAX: ['#006778', '#D7A22A'] };
const GAME_KINDS = ['spread', 'ml', 'total', 'last'];
const isGameBet = l => GAME_KINDS.includes(l.kind) || l.kind === 'ml';

function teamScore(team, g) { return team === g.home ? [sum(g.h), sum(g.a)] : [sum(g.a), sum(g.h)]; }
function atBats(l) {
  return `<div class="ps"><p class="ps-h">At-bats · ${l.pas.length} PA</p><div class="pas">${l.pas.map(p => `<div><span>${p[0]}</span><b>${p[1]}</b><em class="${p[2] ? 'tb' : 'tb0'}">${p[2]} TB</em></div>`).join('')}</div></div>`;
}
function rightCol(l, g, odds) {
  const small = t => `<span style="font-size:13px;color:var(--faint);font-family:var(--body);font-weight:500">${t}</span>`;
  let v = '';
  if (l.result === 'void') v = `<span class="v" style="color:var(--muted)">VOID</span>`;
  else if (l.kind === 'count' || l.kind === 'total') v = `<span class="v"><span class="num" data-live="leg-${l.game}-${l.id}" data-val="${l.actual}">${l.actual}</span>${small(l.target == null ? ' ' + l.unit : ' / ' + lineOf(l))}</span>`;
  else if ((l.kind === 'spread' || l.kind === 'ml') && g.final && g.a) {
    const team = l.side === 'home' ? g.home : g.away, [mine, theirs] = teamScore(team, g);
    v = `<span class="v">${team} ${mine}–${theirs}</span>`;
  } else if (l.kind === 'last') v = `<span class="v">${l.team}</span>`;
  return `<span class="right">${odds != null ? `<span class="o">${l.est ? '<small class="est">est.</small> ' : ''}${fo(odds)}</span>` : ''}${v}</span>`;
}
function mini(l) {
  if (!(l.kind === 'count' || l.kind === 'total') || l.target == null || l.result === 'void') return '';
  const max = Math.max(l.target, l.actual);
  return `<span class="mini" aria-hidden="true"><i style="width:${Math.min(100, l.actual / max * 100)}%"></i><b style="left:${l.target / max * 100}%"></b></span>`;
}
function board(g) {
  if (!g.per && (g.a || g.h)) g.per = Array.from({ length: Math.max((g.a || []).length, (g.h || []).length) }, (_, i) => String(i + 1));
  if (g.live && started(g)) return liveBug(g);
  if (!g.a || !g.per || (!g.final && !started(g))) {
    const t = g.final ? 'Final' : started(g) ? liveTxt(g) : when(g) + (g.tag ? ' · ' + g.tag : '');
    return `<div class="board"><div class="pre-strip"><span>${g.away}</span><span>${t}</span><span>${g.home}</span></div></div>`;
  }
  const wide = g.per.length > 5;
  const r = (n, arr) => `<tr><td>${n}</td>${g.per.map((_, i) => `<td>${arr[i] ?? ''}</td>`).join('')}<td class="tot">${sum(arr)}</td></tr>`;
  return `<div class="board"><table><thead><tr><th>${g.final ? 'Final' + (wide ? '' : ' · ' + dayOf(g.start)) : (g.detail || 'Live')}</th>${g.per.map(p => `<th>${p}</th>`).join('')}<th>${wide ? 'R' : 'T'}</th></tr></thead><tbody>${r(wide ? g.away : g.an, g.a || [])}${r(wide ? g.home : g.hn, g.h || [])}</tbody></table></div>`;
}
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const inningText = L => ({ top:'Top ', bottom:'Bot ', mid:'Mid ', end:'End ' }[L.half] || '') + ord(L.inning);
const liveTxt = g => g.live ? 'Live · ' + inningText(g.live) : 'Live' + (g.detail ? ' · ' + g.detail : '');
function liveBug(g) {
  const L = g.live, on = i => L.bases[i] ? '#F5C02E' : 'none', ring = i => L.bases[i] ? '#F5C02E' : '#6E6E6E';
  // diamond: 1st right, 2nd top, 3rd left
  const base = (x, y, i) => `<rect x="${x - 8}" y="${y - 8}" width="16" height="16" transform="rotate(45 ${x} ${y})" fill="${on(i)}" stroke="${ring(i)}" stroke-width="2"/>`;
  const outs = [0, 1, 2].map(i => `<i class="${i < L.outs ? 'on' : ''}"></i>`).join('');
  const arrow = L.half === 'top' ? '▲' : L.half === 'bottom' ? '▼' : '';
  const sa = sum(L.a), sh = sum(L.h);
  const cols = Math.max(L.a.length, 9);
  const cell = (arr, i) => i < arr.length ? arr[i] : '';
  const r = (n, arr, tot) => `<tr><td>${n}</td>${Array.from({ length:cols }, (_, i) => `<td>${cell(arr, i)}</td>`).join('')}<td class="tot">${tot}</td></tr>`;
  return `<div class="bug">
      <div class="bug-score"><div><span>${g.away}</span><b>${sa}</b></div><div><span>${g.home}</span><b>${sh}</b></div></div>
      <div class="bug-state"><span class="inn">${arrow} ${inningText(L)}</span><span class="outs" aria-label="${L.outs} out">${outs}<em>${L.outs} out</em></span></div>
      <svg class="diamond" viewBox="0 0 80 64" role="img" aria-label="Runners on ${['first','second','third'].filter((_, i) => L.bases[i]).join(' and ') || 'no bases'}">${base(58, 36, 0)}${base(40, 18, 1)}${base(22, 36, 2)}</svg>
    </div>
    ${L.batter ? `<p class="stat">At bat: ${L.batter} · Pitching: ${L.pitcher}</p>` : ''}
    <div class="board"><table><thead><tr><th>${ord(L.inning)} inning</th>${Array.from({ length:cols }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>R</th></tr></thead><tbody>${r(g.away, L.a, sa)}${r(g.home, L.h, sh)}</tbody></table></div>
    ${L.sample ? '<p class="note"><b class="smp">SAMPLE</b> Live game state is placeholder data until scores are connected.</p>' : ''}`;
}
function track(actual, target, s, unit) {
  if (target == null) {
    return `<div class="big"><div class="trk" role="img" aria-label="${actual} ${unit}"><span class="ln"></span><span class="fl ${s}" style="width:100%"></span><span class="dt ${s}" style="left:100%"></span></div>
      <div class="scale2"><span class="z">0</span><span class="e">${actual}</span></div></div>`;
  }
  const max = Math.max(target, actual, 0.0001);
  const p = v => Math.min(100, Math.max(0, v) / max * 100);
  const tp = p(target);
  const tLabel = tp >= 95 ? `<span class="t" style="right:0">${target}</span>` : `<span class="t" style="left:${tp}%;transform:translateX(-50%)">${target}</span>`;
  const end = actual > target ? `<span class="e">${actual}</span>` : '';
  return `<div class="big">
    <div class="trk" role="img" aria-label="${actual} ${unit}, line ${target}"><span class="ln"></span><span class="fl ${s}" style="width:${p(actual)}%"></span><span class="tg" style="left:${tp}%"></span><span class="dt ${s}" style="left:${p(actual)}%"></span></div>
    <div class="scale2"><span class="z">0</span>${tLabel}${end}</div></div>`;
}
// Spread: a centred margin bar. Right of centre = the picked team ahead, left = the other team ahead.
function spreadTrack(l, g, s) {
  const team = l.side === 'home' ? g.home : g.away, opp = l.side === 'home' ? g.away : g.home;
  const m = margin(l, g), need = -l.line;
  const span = Math.max(Math.abs(m), Math.abs(need), 7) * 1.15;
  const pos = v => 50 + v / span * 50;
  const p = pos(m), cp = pos(need);
  const fill = m >= 0 ? `left:50%;width:${p - 50}%` : `left:${p}%;width:${50 - p}%`;
  const result = m > 0 ? `${team} by ${m}` : m < 0 ? `${opp} by ${-m}` : 'Tie';
  const cover = need > 0 ? `${team} by ${Math.floor(need) + 1}+` : `${opp} by ${Math.ceil(-need) - 1} or less`;
  return `<div class="big">
    <div class="sp-top"><span><small>To cover</small><b>${cover}</b></span><span><small>Final margin</small><b class="${s}">${result}</b></span></div>
    <div class="trk" role="img" aria-label="Final margin ${result}, needed ${cover}"><span class="ln"></span><span class="fl ${s}" style="${fill}"></span><span class="zero" style="left:50%"></span><span class="tg" style="left:${cp}%"></span><span class="dt ${s}" style="left:${p}%"></span></div>
    <div class="scale3"><span>${opp} ahead</span><span>${team} ahead</span></div></div>`;
}
function statTiles(l) {
  const s = l.ps; if (!s) return '';
  const groups = [];
  const rec = s.rec != null && ['REC', s.rec, 'YDS', s.recYds, 'TD', s.recTd];
  const rush = s.car != null && ['CAR', s.car, 'YDS', s.rushYds, 'TD', s.rushTd];
  const pass = s.att != null && ['C/ATT', `${s.cmp}/${s.att}`, 'YDS', s.passYds, 'TD', s.passTd, 'INT', s.int];
  const order = s.first === 'pass' ? [['Passing', pass], ['Rushing', rush], ['Receiving', rec]] : s.first === 'rush' ? [['Rushing', rush], ['Receiving', rec], ['Passing', pass]] : [['Receiving', rec], ['Rushing', rush], ['Passing', pass]];
  order.forEach(([name, arr]) => {
    if (!arr) return;
    const cells = [];
    for (let i = 0; i < arr.length; i += 2) if (arr[i + 1] != null) cells.push(`<div><b>${arr[i + 1]}</b><small>${arr[i]}</small></div>`);
    groups.push(`<div class="ps"><p class="ps-h">${name}</p><div class="ps-row" style="grid-template-columns:repeat(${cells.length},minmax(0,1fr))">${cells.join('')}</div></div>`);
  });
  return groups.join('');
}
function tdDiagrams(l) {
  const tds = l.tds || []; if (!tds.length) return '';
  // one zoom for every diagram on a leg: back to the longest score (min 20 yards)
  const zoom = Math.max(20, Math.ceil((Math.max(...tds.map(t => t.yds)) + 6) / 10) * 10);
  const W = 260, Y = W / zoom, goal = W;
  return tds.map(td => {
    const start = goal - td.yds * Y;
    const [ez, ink] = TEAMC[td.team] || ['#1F2A44', '#FFFFFF'];
    const lines = [];
    for (let y = 0; y <= zoom; y += 5) lines.push(`<line x1="${goal - y * Y}" y1="14" x2="${goal - y * Y}" y2="96" stroke="#FFFFFF" stroke-opacity="${y % 10 ? .2 : .5}" stroke-width="${y ? 1 : 2}"/>`);
    const nums = [];
    for (let y = 10; y <= zoom; y += 10) if (goal - y * Y > 8) nums.push(`<text x="${goal - y * Y}" y="108" fill="#A8A8A8" font-family="Barlow, sans-serif" font-size="10" text-anchor="middle">${y <= 50 ? y : 100 - y}</text>`);
    const label = `${td.yds}-yd ${td.how}`;
    const lx = Math.min(Math.max(start, 34), 230);
    // the play itself is replayed as X's and O's when the leg opens (static/parlay/play.js); tap the field to run it again
    const spec = JSON.stringify({ yds: td.yds, how: td.how, q: td.q, clock: td.clock, play: td.play }).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    return `<div class="field"><svg viewBox="0 0 330 110" role="img" aria-label="${label}, ${td.q}${td.clock ? ' ' + td.clock : ''}. Tap to replay" data-td="${spec}" data-s="${start}" data-goal="${goal}" data-y="${Y}">
      <rect x="0" y="14" width="${goal}" height="82" fill="#1F5A2A"/>
      <rect x="${goal}" y="14" width="70" height="82" fill="${ez}" class="ez"/>
      <text x="${goal + 35}" y="88" fill="${ink}" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="16" text-anchor="middle" letter-spacing="2">${td.team}</text>
      ${lines.join('')}${nums.join('')}
      <text x="${goal}" y="108" fill="#A8A8A8" font-family="Barlow, sans-serif" font-size="10" text-anchor="middle">G</text>
      <line class="td-static" x1="${start}" y1="50" x2="${goal + 22}" y2="50" stroke="#53D337" stroke-width="3" stroke-linecap="round"/>
      <path class="td-static" d="M${goal + 22} 43 L${goal + 32} 50 L${goal + 22} 57 Z" fill="#53D337"/>
      <circle class="td-static" cx="${start}" cy="50" r="6" fill="#FFFFFF"/>
      <text x="${lx}" y="9" fill="#FFFFFF" font-family="Barlow, sans-serif" font-weight="700" font-size="11" text-anchor="middle">${label}</text>
      <line x1="${start}" y1="12" x2="${start}" y2="42" stroke="#FFFFFF" stroke-opacity=".5" stroke-dasharray="2 3"/>
      <text x="326" y="9" text-anchor="end" class="replay">↻ REPLAY</text>
    </svg><p class="stat">${[td.q, td.clock, td.desc || (td.play && td.play.text)].filter(Boolean).join(' · ')}</p></div>`;
  }).join('');
}
function goalTimeline(l) {
  if (!l.goals) return '';
  const cashAt = Math.ceil(l.target) - 1;
  const marks = l.goals.map(([t, m], i) => `<span class="gm ${t === 'UTA' ? 'up' : 'dn'}" style="left:clamp(15px, ${m / 60 * 100}%, calc(100% - 15px))"><i class="tm ${t}${i === cashAt ? ' cash' : ''}">${t}</i></span>`).join('');
  return `<div class="tl" role="img" aria-label="Goals by game time"><div class="tl-ax"></div><div class="tl-div" style="left:33.333%"></div><div class="tl-div" style="left:66.666%"></div>${marks}<div class="tl-per"><span>P1</span><span>P2</span><span>P3</span></div></div>`;
}
function receivers(l) {
  if (!l.receivers) return '';
  return `<div class="board"><table><thead><tr><th>Receiving</th><th>Rec</th><th>Yds</th><th>TD</th></tr></thead><tbody>${l.receivers.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="tot">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
}
function passLine(l) {
  if (!l.passing) return '';
  return `<div class="pline">${l.passing.map(p => `<div><b>${p[1]}</b><small>${p[0]}</small></div>`).join('')}</div>`;
}

  const was = SC_ORDER; SC_ORDER = order;
  if (!was || calm() || was.join() === order.join()) return;
  lis.forEach((li, i) => {
    const m = order[i], b = before[m]; if (b == null || was.indexOf(m) === i) return;
    const d = b - li.getBoundingClientRect().top;
    if (Math.abs(d) > 1) li.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 700, easing: 'cubic-bezier(.3,1.15,.4,1)' });
  });
}
// ---- season: bettors race into their order, then each section reveals as you scroll to it ----
let IO = null;
function seasonMotion(v) {
  if (IO) { IO.disconnect(); IO = null; }
  if (calm()) return;
  const rows = [...v.querySelectorAll('.board-list > .mgr')];
  if (rows.length && !rows.some(r => r.classList.contains('on'))) {
    const tops = rows.map(r => r.offsetTop);
    const alpha = rows.map((r, i) => ({ i, n: r.dataset.mgr })).sort((a, b) => nm(a.n).localeCompare(nm(b.n)));
    alpha.forEach((a, slot) => {
      const d = tops[slot] - tops[a.i];
      if (d) rows[a.i].animate([{ transform: `translateY(${d}px)` }, { transform: `translateY(${d}px)`, offset: .22 }, { transform: 'none' }], { duration: 1500, easing: 'cubic-bezier(.65,0,.25,1)' });
    });
  }

  v.querySelectorAll('.season > .hist.card').forEach(ol => { ol.classList.add('await'); targets.push(ol); });
  v.querySelectorAll('.season > .inbars, .season > .funders, .season .prof-list').forEach(x => { x.classList.add('await-up'); targets.push(x); });
  const prof = v.querySelector('.season .prof svg'); if (prof) targets.push(prof);

}
function revealSection(el) {
  if (el.classList.contains('hist')) {
    histReveal(el);
    if (window.Motion) el.querySelectorAll('.h-o').forEach((o, i) => setTimeout(() => Motion.slot(o, 650), Math.min(i, 14) * 90 + 420));
    return;
  }
  if (el.tagName === 'svg') {
    // each bettor's dot wanders in from the middle of the chart and settles where they really are
    el.querySelectorAll(':scope > g').forEach((g, i) => {
      const c = g.querySelector('circle'), x = +c.getAttribute('cx'), y = +c.getAttribute('cy');
      const ax = 170 - x + (Math.random() - .5) * 50, ay = 130 - y + (Math.random() - .5) * 40;
      const bx = (Math.random() - .5) * 110, by = (Math.random() - .5) * 80;
      g.animate([{ transform: `translate(${ax}px,${ay}px)`, opacity: 0 }, { transform: `translate(${bx}px,${by}px)`, opacity: 1, offset: .45 }, { transform: 'translate(0px,0px)', opacity: 1 }],
        { duration: 1500 + i * 110, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'backwards' });
    });
    return;
  }
  el.classList.remove('await-up'); el.classList.add('rise');
  // money in: bars race out, the dollar amounts count up with them
  el.querySelectorAll('.bar i').forEach((b, i) => b.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 1100, delay: 150 + i * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  el.querySelectorAll(':scope > li').forEach((li, i) => li.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: i * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  if (el.classList.contains('inbars')) el.querySelectorAll('li > b').forEach((b, i) => { const n = +b.textContent.replace(/[^\d.]/g, ''); b.dataset.count = n; b.dataset.fmt = 'dollars'; setTimeout(() => countUp(b, 1000), 150 + i * 70); });
}
function confetti(n = 60, slow = false) {
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  const colors = ['#53D337', '#F5C02E', '#38BDF8', '#F472B6', '#FB923C', '#FFFFFF'];
  // slow: a longer, fuller fall for opening a ticket that cashed
  const dur = () => slow ? 2400 + Math.random() * 1800 : 1300 + Math.random() * 900, delay = () => Math.random() * (slow ? 900 : 250);
  box.innerHTML = Array.from({ length: n }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};--dx:${(Math.random() - .5) * (slow ? 220 : 160)}px;--r:${Math.random() * 720 - 360}deg;animation-delay:${delay()}ms;animation-duration:${dur()}ms;${i % 3 === 0 ? 'width:6px;height:6px;border-radius:50%;' : ''}"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), slow ? 5300 : 2600);
}
function render() {
  const ws = weeks();
  const tabsHTML = `<a href="#scores" class="tab" aria-current="${current === 'scores' ? 'page' : 'false'}">Scores</a><a href="#season" class="tab" aria-current="${current === 'season' ? 'page' : 'false'}">Season</a>`
    + (PICK_WEEK ? `<a href="#picks" class="tab tab-pick${PICKS_SEEN || current === 'picks' ? '' : ' new'}" aria-current="${current === 'picks' ? 'page' : 'false'}">Make Wk ${PICK_WEEK} picks</a>` : '')
    + LIVE.concat(HISTORY).map(w => `<a href="#${w.key}" class="tab" aria-current="${w.key === current ? 'page' : 'false'}">${stillLive(w.key) ? '<i class="tab-live" aria-label="live"></i>' : ''}${w.label}</a>`).join('')
    // far right, past every week, so they stay out of screenshots. Bookie = Will + Pandolfi, LM = Will
    + (['admin', 'slip'].includes(ROLE) ? `<a href="#bookie" class="tab tab-bookie" aria-current="${current === 'bookie' ? 'page' : 'false'}">Bookie Tools</a>` : '')
    + (ROLE === 'admin' ? `<a href="#lm" class="tab tab-lm" aria-current="${current === 'lm' ? 'page' : 'false'}">LM Tools</a>` : '');
  // only touch the tabs when they change, so a refresh doesn't cut a gliding pill short
  const tabsEl = document.getElementById('tabs');
  if (tabsEl._html !== tabsHTML) { tabsEl._html = tabsHTML; tabsEl.querySelectorAll('.tab').forEach(t => t.remove()); tabsEl.insertAdjacentHTML('afterbegin', tabsHTML); }
  glideTabs();
  document.getElementById('pickhint').hidden = PICKS_SEEN || !PICK_WEEK || ['picks', 'bookie', 'lm'].includes(current);
  if (PICK_WEEK) document.getElementById('hintwk').textContent = `Make Wk ${PICK_WEEK} picks`;
  const v = document.getElementById('view'), pf = document.getElementById('picksframe');
  v.classList.toggle('enter', firstPaint);   // first draw of a tab: bars grow, pips light up in order
  // the pick sheet lives in its own page; inside the tracker it sits in a frame that's kept alive between tabs
  const framed = FRAMES[current];
  v.hidden = !!framed;
  Object.keys(FRAMES).forEach(k => { document.getElementById(k + 'frame').hidden = k !== current; });
  document.documentElement.classList.toggle('on-picks', current === 'picks');
  if (framed) {
    const f = document.getElementById(current + 'frame');
    if (!f.src) f.src = framed + (SB ? '&sandbox=1' : '');
    if (current === 'picks') try { f.contentWindow.postMessage({ pbShown: true }, location.origin); } catch (e) {}
    slideIn(f);
    document.getElementById('updated').textContent = '';
    sizePicks(); firstPaint = false;
    return;
  }
  if (current === 'scores') {
    const before = {}; v.querySelectorAll('.sc-list > li').forEach(li => { before[li.querySelector('.sc-row').dataset.m] = li.getBoundingClientRect().top; });
    v.innerHTML = scoresHTML();
    if (firstPaint) SC_ORDER = null;
    flipScores(v, before); slideIn(v);
    document.getElementById('updated').textContent = SCORES && SCORES.at ? 'Updated ' + new Date(SCORES.at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/New_York' }) : '';
    if (SCORES && SCORES.teams) firstPaint = false;   // bars grow on the first draw that has scores
    return;
  }
  if (current === 'season') {
    v.innerHTML = (LOADED[LIVE_KEY] ? seasonHTML() : '<p class="t-sum">Loading…</p>');
    if (LOADED[LIVE_KEY] && firstPaint) seasonMotion(v);
    slideIn(v);
    if (LOADED[LIVE_KEY] && !countedUp) { countedUp = true; v.querySelectorAll('.tiles [data-count]').forEach(el => countUp(el)); }
    document.getElementById('updated').textContent = '';
    if (LOADED[LIVE_KEY]) firstPaint = false;
    return;
  }
  const w = ws.find(x => x.key === current);
  v.innerHTML = w ? ticketHTML(w.tickets[0], w.games, w.key) : '<article class="ticket"><div class="t-head"><p class="t-sum">Loading ticket…</p></div></article>';
  // settled tickets reveal like the Season page: each mark starts at the right edge of its row
  const lg = v.querySelector('.ticket.won .legs, .ticket.lost .legs'), rm = lg && lg.querySelector('.row-main');
  if (lg && rm) lg.style.setProperty('--dx', Math.max(0, rm.clientWidth - 32 - 28) + 'px');
  slideIn(v);
  document.getElementById('updated').textContent = current === LIVE_KEY && AS_OF ? 'Updated ' + new Date(AS_OF).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/New_York' }) : '';
  if (w) { firstPaint = false; flashId = null; }
}
const safeRender = () => { try { render(); afterRender(document.getElementById('view')); } catch (e) { console.error('[Parlay] render failed', e); } };
// pages that live in pick-sheet frames (kept alive between tabs)
const FRAMES = { picks: '/picks?embed=1', bookie: '/picks?embed=1&view=bookie', lm: '/picks?embed=1&view=lm' };
function sizePicks() {
  const pf = document.getElementById((FRAMES[current] ? current : 'picks') + 'frame');
  if (pf.hidden) return;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  pf.style.height = Math.max(420, vh - pf.getBoundingClientRect().top) + 'px';
}
window.addEventListener('resize', sizePicks);
// the pick sheet asks the tracker to open a tab (e.g. its "See past parlays" link)
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.pbTab) location.hash = e.data.pbTab;
  if ('pbLocked' in e.data) document.documentElement.classList.toggle('picks-locked', !!e.data.pbLocked);
});
const valid = h => (h === 'picks' && !!PICK_WEEK) || (h === 'bookie' && ['admin', 'slip'].includes(ROLE)) || (h === 'lm' && ROLE === 'admin') || LIVE.some(w => w.key === h) || HISTORY.some(w => w.key === h) || h === 'season' || h === 'scores';
document.getElementById('view').addEventListener('click', e => {
  const fs = e.target.closest('.field svg[data-td]');
  if (fs && window.PlayAnim) { PlayAnim.play(fs); return; }
  const r = e.target.closest('.row');
  if (r) { flashId = r.dataset.id; toggleOne(r.dataset.id, `[data-id="${r.dataset.id}"]`); return; }
  const lw = e.target.closest('.lw-row');
  if (lw) { toggleOne('low-' + lw.dataset.low, `.lw-row[data-low="${lw.dataset.low}"]`); return; }
  const sc = e.target.closest('.sc-row');
  if (sc) { toggleOne('sc-' + sc.dataset.m, `.sc-row[data-m="${sc.dataset.m}"]`); return; }
  const m = e.target.closest('.mgr');
  if (m) toggleOne('mgr-' + m.dataset.mgr, `.mgr[data-mgr="${m.dataset.mgr}"]`);
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (valid(h)) { const order = [...document.querySelectorAll('#tabs .tab')].map(a => a.hash.slice(1)); SLIDE = order.indexOf(h) >= order.indexOf(current) ? 'r' : 'l'; current = h; firstPaint = true; if (h === 'season') countedUp = false; safeRender(); window.scrollTo(0, 0); if (h === 'scores') loadScores(); } });
async function fetchWeek(spec) {
  const r = await fetch('/api/parlay/' + spec.slug, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  const fresh = !LOADED[spec.key];
  LOADED[spec.key] = fromApi(d, spec);
  // only redraw if it changes what's on screen (a redraw mid-entrance would cut the animations short)
  if (window.PlayAnim && PlayAnim.busy() && current === spec.key) { setTimeout(safeRender, 3500); return d; }
  if (current === spec.key || current === 'season' || (fresh && !weeks().some(w => w.key === current) && !['scores', 'picks', 'bookie', 'lm'].includes(current))) safeRender();

}
let loadTimer = null;
async function load() {
  clearTimeout(loadTimer);
  let next = 60000;
  try {
    const d = await fetchWeek(LIVE[0]);
    AS_OF = d.asOf;
    if (current === LIVE_KEY) document.getElementById('updated').textContent = 'Updated ' + new Date(AS_OF).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/New_York' });
    if (Object.values(d.games).some(g => g.state === 'in')) next = 20000;
  } catch (e) {
    if (current === LIVE_KEY) document.getElementById('updated').textContent = 'Couldn’t refresh. Retrying…';
    next = 15000;
  }
  loadTimer = setTimeout(load, next);
}
// ---------- fantasy scores (who's paying next week) ----------
let SCORES = null, scoresTimer = null;
async function loadScores() {
  clearTimeout(scoresTimer);
  try {
    const r = await fetch('/api/fantasy/scores', { cache: 'no-store' }); const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    SCORES = Object.assign(d, { at: new Date().toISOString(), err: null });
  } catch (e) { SCORES = Object.assign(SCORES || {}, { err: e.message || 'Couldn’t reach ESPN' }); }
  if (current === 'scores') safeRender();
  if (current === 'scores') scoresTimer = setTimeout(loadScores, SCORES && SCORES.final ? 300000 : 60000);

const pts = n => (+n).toFixed(2);
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
function scoresHTML() {
  if (!SCORES || !SCORES.teams) return SCORES && SCORES.err ? `<p class="t-sum">${SCORES.err}</p>` : '<p class="t-sum">Loading scores…</p>';
  const d = SCORES, T = d.teams, wk = d.week, low = T[0].points;   // server sorts lowest first, ties by projection
  const place = t => 1 + T.filter(o => o.points > t.points).length;   // ties share a place (0-0 before kickoff: everyone 1st)
  const max = Math.max(...T.map(t => Math.max(t.points, t.projected)), 1);
  const left = T.reduce((n, t) => n + t.yetToPlay + t.playing, 0);
  const started = low > 0 || T.some(t => t.points > 0);
  const rows = T.map((t, i) => {
    const lowest = t.points === low && (d.final || low > 0), projLow = !lowest && i === 0 && !d.final;
    const id = 'sc-' + t.manager, isOpen = open.has(id), c = mcolor(t.manager);
    const tag = lowest ? `<span class="sc-tag">${d.final ? 'Pays Wk ' + (wk + 1) : 'Lowest now'}</span>` : projLow ? '<span class="sc-tag proj">Projected low</span>' : '';
    const sub = [t.team, t.playing ? `${t.playing} playing` : '', t.yetToPlay ? `${t.yetToPlay} yet to play` : ''].filter(Boolean).join(' · ');
    const detail = isOpen ? `<ul class="sc-pl">${t.live.map(p => `<li class="${p.state}"><span>${p.pos}</span><b>${p.name}</b><em>${p.state === 'pre' ? (p.detail || 'Yet to play') : p.state === 'in' ? 'Playing · ' + (p.detail || '') : p.state === 'bye' ? 'Bye' : 'Done'}</em><strong>${pts(p.pts)}</strong></li>`).join('')}</ul>` : '';
    return `<li style="--mc:${c}"><button type="button" class="sc-row${lowest ? ' low' : projLow ? ' plow' : ''}" data-m="${t.manager}" aria-expanded="${isOpen}">
      <span class="sc-rk">${ordinal(place(t))}</span>
      <span class="sc-who">${avatar(t.manager)}<span class="sc-nm"><b>${t.manager}${tag}</b><span>${sub}</span></span></span>
      <span class="sc-pts"><b data-live="sc-${t.manager}" data-val="${t.points}" data-dp="2">${pts(t.points)}</b><small>proj ${pts(t.projected)}</small></span>
      <span class="sc-bar" aria-hidden="true"><i style="width:${t.points / max * 100}%"></i><em style="left:${t.projected / max * 100}%"></em></span>
    </button>${detail}</li>`;
  }).join('');

    const id = 'low-' + x.week, isOpen = open.has(id), worst = x.points === seasonLow;
    const all = isOpen && x.scores ? `<ol class="lw-all">${x.scores.map((r, i) => `<li style="--mc:${mcolor(r.manager)}"${r.points === x.points ? ' class="lo"' : ''}><span>${ordinal(1 + x.scores.filter(o => o.points > r.points).length)}</span>${avatar(r.manager, 'sm')}<b>${r.manager}</b><em>${pts(r.points)}</em></li>`).join('')}</ol>` : '';
    return `<li class="${worst ? 'worst' : ''}"><button type="button" class="lw-row" data-low="${x.week}" aria-expanded="${isOpen}"><span class="lw-wk">Wk ${x.week}</span><span class="lw-who">${x.managers.map(m => avatar(m, 'sm')).join('')}<b>${x.managers.join(' & ')}</b>${worst ? '<span class="sc-tag">Season low</span>' : ''}</span><em>${pts(x.points)}</em><span class="lw-chev" aria-hidden="true">${isOpen ? '−' : '+'}</span></button>${all}</li>`;
  }).join('');
  return `<section class="scores">
    <h2 class="label">Week ${wk} fantasy scores</h2><p class="lead">Tap a name for their lineup.</p>
    <ol class="sc-list">${rows}</ol>
    ${lowRows ? `<h2 class="label sc-gap">Lowest score by week</h2><p class="lead">Tap a week for everyone’s final score.</p><ol class="sc-lows">${lowRows}</ol>` : ''}
  </section>`;
}

async function loadWeeks() {
  try {
    const d = await (await fetch('/api/parlay/weeks' + (SB ? '?sandbox=1' : ''), { cache: 'no-store' })).json();
    if (d.weeks && d.weeks.length) {
      LIVE = d.weeks.map(w => ({ key: 'w' + w.week + (w.test ? 't' : ''), label: `Wk ${w.week}${w.test ? ' (test)' : ''}`, slug: w.slug }));
      LIVE_KEY = LIVE[0].key;
    }
    PICK_WEEK = d.pickWeek; PICK_FUNDERS = d.pickWeekFunders || [];
  } catch (e) {}
}
(async function init() {
  await Promise.all([
    fetch('/api/whoami?page=tracker', { cache: 'no-store' }).then(r => r.json()).then(d => { ROLE = d.role; }).catch(() => {}),
    loadWeeks()
  ]);
  current = LIVE_KEY;
  const h = location.hash.slice(1); if (valid(h)) current = h; safeRender(); load();
  // older live-served weeks are settled: fetch once
  LIVE.slice(1).forEach(spec => fetchWeek(spec).catch(e => console.error('[Parlay] ' + spec.slug, e)));
  if (current === 'scores') loadScores();
  setTimeout(() => { const pf = document.getElementById('picksframe'); if (PICK_WEEK && !pf.src) pf.src = '/picks?embed=1' + (SB ? '&sandbox=1' : ''); }, 1500);
})();
setInterval(() => { if (!(window.PlayAnim && PlayAnim.busy())) safeRender(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
